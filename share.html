<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a9aeb6">
<meta name="robots" content="noindex">
<title>SizeBook · Подарок в размер</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<script src="/sb-common.js"></script>
<style>
/* Страница, которой делятся: паспорт-термоэтикетка, только просмотр */
:root{--ink:#0d0d0d;--ink2:#5f6166;--ink3:#9a9ca1;--lab:#fdfdfb;--bg:#e7e8ea;--line:#c4c6ca;
  --disp:"Archivo",-apple-system,"Helvetica Neue",Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--disp);-webkit-font-smoothing:antialiased}
a{color:inherit}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(30px + var(--safe-b))}
.num{font-variant-numeric:tabular-nums}
.top{padding:calc(18px + var(--safe-t)) 16px 26px;background:
  radial-gradient(60% 40% at 20% 30%,rgba(255,255,255,.55),transparent 70%),
  radial-gradient(50% 30% at 80% 70%,rgba(255,255,255,.4),transparent 70%),
  linear-gradient(160deg,#9aa0a8,#b9bec5 40%,#8f959e 60%,#aeb3ba)}
.lt{display:flex;justify-content:space-between;align-items:center;padding:0 2px 16px;gap:12px}
.lt h1{margin:0;font:900 28px var(--disp);text-transform:uppercase;letter-spacing:-.02em}
.lt span{font:700 10px var(--mono);text-transform:uppercase;letter-spacing:.08em;background:var(--lab);border:2px solid var(--ink);padding:5px 8px}
.label{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;background:var(--ink);border:2px solid var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.2),0 16px 28px -14px rgba(0,0,0,.45)}
.label>*{background:var(--lab);min-width:0}
.span2{grid-column:span 2}.span3{grid-column:1/-1}
.z1{padding:9px 12px;font:500 10px/1.5 var(--mono)}
.z1 b{display:block;font:900 21px/1.05 var(--disp);text-transform:uppercase;margin:3px 0 2px;letter-spacing:-.01em;overflow-wrap:anywhere}
.route{background:var(--ink)!important;color:#fff;display:flex;flex-direction:column;justify-content:center;padding:9px 12px;font:900 42px/1 var(--disp)}
.route small{font:500 10px var(--mono);letter-spacing:.1em;margin-bottom:4px;opacity:.85}
.cell{padding:8px 12px;min-height:60px}
.cap{display:block;font:600 9px var(--mono);text-transform:uppercase;letter-spacing:.04em}
.cell b{font:900 26px/1.1 var(--disp);letter-spacing:-.02em;overflow-wrap:anywhere}
.cell b.sm{font-size:19px}
.cell b.empty{color:#b0b2b6}
.cell .cv{display:block;font:500 9.5px var(--mono);color:var(--ink3);margin-top:2px}
.body{padding:0 16px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 4px}
.sec h2{margin:0;font:900 22px var(--disp);text-transform:uppercase}
.sec span{font:500 11px var(--mono);color:var(--ink2)}
.hint{font:500 11px/1.5 var(--mono);color:var(--ink2);margin-top:6px}
.rows{display:grid;gap:2px;background:var(--ink);border:2px solid var(--ink);margin-top:12px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:2px;background:var(--ink)}
.brow>*{background:var(--lab);padding:10px 12px;min-width:0}
.brow .bn{font:800 15px/1.2 var(--disp);display:flex;align-items:center;overflow-wrap:anywhere}
.brow .bs{display:grid;gap:4px}
.brow .bs div{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.brow .bs b{font:900 17px var(--disp);border:2px solid var(--ink);padding:0 6px;line-height:1.3}
.brow .bs span{font:500 10.5px var(--mono);color:var(--ink2)}
.row{display:grid;grid-template-columns:84px minmax(0,1fr) 98px;gap:2px;background:var(--ink);text-align:left;width:100%;height:96px;text-decoration:none}
.row>*{background:var(--lab);min-width:0}
.th{display:grid;place-items:center;overflow:hidden;background:#fff!important;position:relative}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:6px;mix-blend-mode:multiply}
.ini{font:900 26px var(--disp);color:#d4d5d8;text-transform:uppercase}
.row .tx{padding:8px 10px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.row .bd{font:700 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tt{font:800 14px/1.2 var(--disp);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .mt{font:500 10px var(--mono);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pr{padding:8px 10px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;text-align:right}
.row .pr b{font:900 15px/1.15 var(--disp);white-space:nowrap}
.row .pr span{font:500 10px var(--mono);color:var(--ink3);white-space:nowrap;margin-top:2px}
.row .pr .none{color:var(--ink3)}
.wi{display:grid;gap:2px;background:var(--ink)}
.gb{background:var(--lab);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;min-height:48px}
.gb .nt{font:500 11px/1.45 var(--mono);color:var(--ink);min-width:0}
.gb .nt i{font-style:normal;font-weight:700}
.gb button{flex:none;background:var(--ink);color:#fff;border:0;font:700 11px var(--mono);text-transform:uppercase;padding:0 14px;min-height:40px;cursor:pointer}
.gb button.ghost{background:var(--lab);color:var(--ink);border:2px solid var(--ink)}
.gb .taken a.who{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.gb .taken{flex:0 1 auto;max-width:60%;overflow-wrap:anywhere;text-align:right;font:700 10.5px var(--mono);text-transform:uppercase;border:2px dashed var(--ink3);color:var(--ink2);padding:8px 10px}
.wi.claimed .row .tt,.wi.claimed .row .bd,.wi.claimed .row .pr b,.wi.claimed .row .mt{color:var(--ink3)}
.wi.claimed .row .th img{opacity:.45}
.badge{display:inline-block;background:#ffd400;color:var(--ink);font:700 9px var(--mono);padding:2px 5px;margin-right:6px;vertical-align:1px}
.own{margin-top:16px;background:#fff6c2;border:2px solid var(--ink);padding:10px 12px;font:500 11px/1.5 var(--mono)}
.dlg{position:fixed;inset:0;background:rgba(13,13,13,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.dlg>div{background:var(--bg);border-top:2px solid var(--ink);width:100%;max-width:520px;padding:16px 16px calc(24px + var(--safe-b));display:grid;gap:12px}
.dlg h3{margin:0;font:900 22px var(--disp);text-transform:uppercase}
.dlg p{margin:0;font:500 11px/1.5 var(--mono);color:var(--ink2)}
.dlg label{display:grid;gap:6px;font:700 10px var(--mono)}
.dlg input{font:600 16px var(--disp);padding:12px;border:2px solid var(--ink);background:var(--lab);border-radius:0}
.dlg .go{background:var(--ink);color:#fff;border:0;font:800 14px var(--disp);text-transform:uppercase;min-height:52px}
.dlg .no{background:none;border:0;font:700 12px var(--mono);min-height:44px;text-decoration:underline}
.tgbtn{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;background:#2aabee;color:#fff;border:2px solid var(--ink);font:800 13px var(--disp);text-transform:uppercase;min-height:48px;text-decoration:none}
.me{margin-top:12px;font:500 11px/1.5 var(--mono);color:var(--ink2)}
.ybadge{display:table;background:#ffd400;color:var(--ink);font:700 10px var(--mono);letter-spacing:.04em;padding:3px 6px;margin-top:7px;border:2px solid var(--ink)}
.foot{margin-top:30px;border:2px dashed var(--line);background:var(--lab);padding:16px;font:500 12px/1.55 var(--mono);color:var(--ink2)}
.foot a{display:inline-block;margin-top:10px;background:var(--ink);color:#fff;font:700 11px var(--mono);text-transform:uppercase;padding:9px 12px;text-decoration:none}
.state{padding:60px 20px;text-align:center;font:500 13px/1.6 var(--mono);color:var(--ink2)}
.state b{display:block;font:900 24px var(--disp);text-transform:uppercase;color:var(--ink);margin-bottom:8px}
.sk{height:300px;background:linear-gradient(90deg,#f3f3f1,#fff,#f3f3f1);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top"><div class="lt"><h1>Подарок в размер</h1><span>SizeBook</span></div><div class="label"><div class="sk span3"></div></div></div>
</div>
<script>
const API = location.origin;
// В Telegram Mini App гость узнаётся по подписанным данным Telegram, без регистрации
const TGA = () => (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData) ? Telegram.WebApp : null;
const IN_TG = location.pathname.replace(/\/$/, '') === '/tgapp';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => { try { const x = new URL(String(u)); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch (_) { return ''; } };

const MAIN = [['Верх', ['daily_top']], ['Низ', ['daily_bottom']], ['Верхняя', ['outer', 'outer_jacket']], ['Обувь', ['shoes_eu', 'shoes_sneaker']], ['Шапка', ['hat', 'hat_cap']], ['Кольцо', ['ring_mm']]];
const EXTRA = { formal_jacket: 'Пиджак', formal_pants: 'Брюки костюма', formal_shirt: 'Рубашка', outer_down: 'Пуховик', sport_top: 'Спорт верх', sport_bottom: 'Спорт низ',
  shoes_sneaker: 'Кроссовки', shoes_dress: 'Туфли', shoes_boot: 'Сапоги', shoes_sandal: 'Сандалии', beach_one: 'Купальник', beach_two: 'Купальник раздельный', beach_swim: 'Плавки',
  under_top: 'Бельё верх', under_bottom: 'Бельё низ', under_bra: 'Бюстгальтер', under_body: 'Боди', under_stockings: 'Чулки', under_tights: 'Колготки', under_socks: 'Носки',
  bracelet_cm: 'Браслет, см', belt_cm: 'Ремень, см', hat_winter: 'Зимняя шапка', gloves_size: 'Перчатки', gloves: 'Перчатки', belt: 'Ремень', dress: 'Платье', sleep_size: 'Пижама' };
const ZONES = { tops: 'Верх', bottoms: 'Низ', outer: 'Верхняя', shoes: 'Обувь', hats: 'Головной убор', acc: 'Аксессуар', dresses: 'Платье', bags: 'Сумка', jewelry: 'Украшение', sleep: 'Пижама', formal_jacket: 'Пиджак', formal_pants: 'Брюки', formal_shirt: 'Рубашка' };
const FIT = { small: 'маломерит', true: 'в размер', large: 'большемерит' };
const sval = v => v && typeof v === 'object' ? [v.value, v.brand].filter(Boolean).join(' · ') : (v == null ? '' : String(v).trim());

function state(title, sub) {
  $('app').innerHTML = `<div class="top"><div class="lt"><h1>SizeBook</h1></div></div><div class="state"><b>${esc(title)}</b>${esc(sub)}<br><br><a href="/" style="color:var(--ink);font-weight:700">Открыть SizeBook</a></div>`;
}

function render(d) {
  window._owner = !!d.is_owner; window._me = d.tg_me || '';
  const S = d.sizes || {};
  const first = (keys) => { for (const k of keys) { const v = sval(S[k]); if (v) return v; } return ''; };
  const name = [S.profile_name, S.profile_lastname].filter(Boolean).join(' ') || d.owner || 'Владелец';
  const meta = [S.profile_age && ageText(S.profile_age), S.profile_weight && 'вес ' + S.profile_weight].filter(Boolean).join(' · ');
  const bi = d.birthday ? bdayInfo(d.birthday) : null;
  // Основное: одежда, обувь, рост — три равные ячейки; остальные размеры — если владелец включил «Остальные размеры»
  const cells = [['Одежда', first(['daily_top'])], ['Обувь EU', first(['shoes_eu', 'shoes_sneaker'])], ['Рост', sval(S.profile_height)]];
  if (d.sections && d.sections.more_sizes) MAIN.filter(m => m[0] !== 'Верх' && m[0] !== 'Обувь').forEach(([t, keys]) => { const v = first(keys); if (v) cells.push([t, v]); });
  const used = new Set(MAIN.flatMap(m => m[1]));
  const extra = Object.entries(S).filter(([k, v]) => !used.has(k) && !k.startsWith('profile_') && !k.startsWith('ui_') && sval(v) && EXTRA[k]);
  const hasWish = d.wishlist && d.wishlist.length;
  document.title = (hasWish ? 'Вишлист · ' : 'SizeBook · ') + name;

  let html = `<div class="top"><div class="lt"><h1>${d.sections && d.sections.wishlist ? 'Вишлист' : 'Размеры'}</h1><span>SizeBook</span></div>
    <div class="label">
      <div class="z1 span3">ПОЛУЧАТЕЛЬ / TO:<b>${esc(name)}</b>${meta ? `<span class="num">${esc(meta)}</span>` : ''}${bi ? `<span class="ybadge num">ДР ${esc(bi.date.toUpperCase())} · ${esc(bi.left.toUpperCase())}</span>` : ''}</div>
      ${cells.map(([t, v]) => `<div class="cell"><span class="cap">${t}</span><b class="num ${v ? (v.length > 6 ? 'sm' : '') : 'empty'}">${esc(v || '—')}</b></div>`).join('')}
      ${['chest', 'waist', 'hips'].some(k => sval(S[k])) ? `<div class="cell span3"><span class="cap">Параметры · грудь — талия — бёдра, см</span><b class="num">${['chest', 'waist', 'hips'].map(k => esc(sval(S[k]) || '—')).join('-')}</b></div>` : ''}
      ${extra.map(([k, v]) => `<div class="cell"><span class="cap">${esc(EXTRA[k])}</span><b class="num sm">${esc(sval(v))}</b></div>`).join('')}
      ${(cells.length + extra.length) % 3 ? '<div></div>'.repeat(3 - (cells.length + extra.length) % 3) : ''}
    </div></div><div class="body">`;

  if (d.brand_sizes && d.brand_sizes.length) {
    const by = {};
    d.brand_sizes.forEach(r => { const b = String(r.brand).trim(); (by[b.toLowerCase()] = by[b.toLowerCase()] || { b, rows: [] }).rows.push(r); });
    html += `<div class="sec"><h2>По брендам</h2><span>${Object.keys(by).length}</span></div>
      <div class="hint">Какой размер владелец носит в конкретных брендах</div>
      <div class="rows">${Object.values(by).map(g => { const seen = new Set(); const rows = g.rows.filter(r => { const k = r.zone + '|' + r.size + '|' + (r.fit || ''); if (seen.has(k)) return false; seen.add(k); return true; });
        return `<div class="brow"><div class="bn">${esc(g.b)}</div><div class="bs">${rows.map(r => `<div><b class="num">${esc(r.size)}</b><span>${esc([ZONES[r.zone] || '', FIT[r.fit] || ''].filter(Boolean).join(' · '))}</span></div>`).join('')}</div></div>`; }).join('')}</div>`;
  }

  if (d.wishlist && d.wishlist.length) {
    html += `<div class="sec"><h2>Хочу</h2><span>${d.wishlist.length}</span></div>
      <div class="hint">${d.is_owner ? 'Нажми на вещь, чтобы открыть её в магазине' : 'Нажми на вещь, чтобы открыть её в магазине. Выбрал подарок — отметь «Я подарю»: другие гости увидят, что вещь занята, а именинник не узнает'}</div>
      ${d.is_owner ? '<div class="own">Это твоя страница — так её видят друзья. Кто и что дарит, тебе не показываем, чтобы сохранить сюрприз.</div>' : ''}
      <div class="rows" id="wl">${wishRows(d.wishlist)}</div>`;
  }
  if (TGA()) html += d.tg_me && !d.is_owner ? `<div class="me">Вы вошли как <b>${esc(d.tg_me)}</b>. Это имя увидят другие гости рядом с выбранным подарком.</div>` : '';
  else if (d.tg_app && d.wishlist && d.wishlist.length && !d.is_owner) html += `<a class="tgbtn" href="${esc(d.tg_app)}">Открыть в Telegram</a><div class="me">В Telegram ваша отметка «Я подарю» подпишется вашим аккаунтом — имя вводить не нужно.</div>`;
  html += TGA() ? '</div>' : `<div class="foot">Это паспорт размеров из SizeBook. Хочешь так же: хранить свои размеры, вещи и вишлист и делиться ими по одной ссылке?<br><a href="/">Создать свой паспорт</a></div></div>`;
  $('app').innerHTML = html;
  window._wl = d.wishlist || [];
}
// Имя брони: если есть @username из Telegram — ссылка на профиль (в Mini App откроется внутри Telegram)
function claimWho(name) {
  const m = String(name).match(/@([A-Za-z0-9_]{4,32})\)?$/);
  if (!m) return esc(name);
  return `<a class="who" href="https://t.me/${m[1]}" target="_blank" rel="noopener">${esc(name)}</a>`;
}
function wishRows(list) {
  return list.map(w => {
    const n = normTitle(w.title, w.shop), brand = w.brand || n.brand || '';
    const href = safeUrl(w.url), src = safeUrl(w.image);
    const isT = isTg(w.url);
    const meta = [w.size && 'размер ' + w.size, w.color, isT ? 'Telegram' : (w.shop || '').replace(/^www\./, '')].filter(Boolean).join(' · ');
    const im = src ? `<img referrerpolicy="no-referrer" loading="lazy" alt="" src="${API}/img?w=400&u=${encodeURIComponent(src)}" data-o="${esc(src)}" onerror="if(!this.dataset.d){this.dataset.d=1;this.src=this.dataset.o;return}this.replaceWith(Object.assign(document.createElement('span'),{className:'ini',textContent:'${esc((brand || n.name || '?')[0])}'}))">` : `<span class="ini">${esc((brand || n.name || '?')[0])}</span>`;
    const tag = href ? 'a' : 'div';
    const row = `<${tag} class="row" ${href ? `href="${esc(href)}" target="_blank" rel="noopener noreferrer"` : ''}>
      <div class="th">${im}</div>
      <div class="tx">${brand ? `<span class="bd">${w.priority === 2 ? '<span class="badge">ОЧЕНЬ ХОЧЕТ</span>' : ''}${esc(brand)}</span>` : (w.priority === 2 ? '<span class="bd"><span class="badge">ОЧЕНЬ ХОЧЕТ</span></span>' : '')}<span class="tt">${esc(n.name)}</span><span class="mt">${esc(meta)}</span></div>
      <div class="pr">${priceHtml(w)}</div></${tag}>`;
    const note = w.note ? `<span class="nt"><i>Заметка:</i> ${esc(w.note)}</span>` : '<span class="nt"></span>';
    let act = '';
    if (!window._owner) {
      if (w.claimed && w.claim_mine) act = `<button class="ghost" onclick="unclaim(${w.id})">Вы дарите · отменить</button>`;
      else if (w.claimed) act = `<span class="taken">${w.claim_name ? 'Бронь: ' + claimWho(w.claim_name) : 'Забронировано'}</span>`;
      else act = `<button onclick="askClaim(${w.id})">Я подарю</button>`;
    }
    const bar = (w.note || act) ? `<div class="gb">${note}${act}</div>` : '';
    return `<div class="wi ${w.claimed && !w.claim_mine ? 'claimed' : ''}">${row}${bar}</div>`;
  }).join('');
}

async function init() {
  if (IN_TG) await loadTg();
  const tga = TGA();
  if (IN_TG && !tga) return state('Откройте в Telegram', 'Эта страница работает внутри Telegram. Нажмите на ссылку в чате ещё раз.');
  if (tga) { try { tga.ready(); tga.expand(); tga.setHeaderColor('#9aa0a8'); tga.setBackgroundColor('#e7e8ea'); } catch (_) {} }
  const token = tga ? String(tga.initDataUnsafe.start_param || '') : location.pathname.replace(/^\/s\//, '').replace(/\/$/, '');
  if (!token) return state('Ссылка неполная', 'В адресе нет кода. Попроси прислать ссылку ещё раз.');
  try {
    window._token = token;
    const r = await fetch(API + '/share/' + encodeURIComponent(token), { headers: shareHeaders() });
    if (r.status === 404) return state('Ссылка не работает', 'Её отключили или пересоздали. Попроси прислать новую.');
    if (r.status === 410) return state('Срок ссылки истёк', 'Попроси прислать новую.');
    if (!r.ok) return state('Не удалось открыть', 'Попробуй обновить страницу через минуту.');
    render(await r.json());
    fetch(API + '/rates').then(x => x.ok ? x.json() : null).then(x => { if (x) { RATES = x; const wl = $('wl'); if (wl) wl.innerHTML = wishRows(window._wl); } }).catch(() => {});
  } catch (_) { state('Нет связи', 'Проверь интернет и обнови страницу.'); }
}
// Ключ гостя хранится на телефоне: по нему можно снять свою отметку «Я подарю»
function guestKey() {
  let k = null; try { k = localStorage.getItem('sb_guest_key'); } catch (_) {}
  if (!k) { const a = new Uint8Array(18); crypto.getRandomValues(a); k = Array.from(a, b => b.toString(16).padStart(2, '0')).join(''); try { localStorage.setItem('sb_guest_key', k); } catch (_) {} }
  return k;
}
function loadTg() {
  return new Promise(res => { const sc = document.createElement('script'); sc.src = 'https://telegram.org/js/telegram-web-app.js'; sc.onload = sc.onerror = () => res(); document.head.appendChild(sc); setTimeout(res, 5000); });
}
// Ссылки на магазины из Telegram открываем во внешнем браузере, посты t.me — внутри Telegram
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[href]'); const tga = TGA();
  if (!a || !tga || !/^https?:/.test(a.href)) return;
  e.preventDefault();
  try { /^https:\/\/t\.me\//.test(a.href) ? tga.openTelegramLink(a.href) : tga.openLink(a.href); } catch (_) { location.href = a.href; }
});
function shareHeaders() {
  if (TGA()) return { 'X-Tg-Init': TGA().initData };
  const h = { 'X-Guest-Key': guestKey() };
  try { const t = localStorage.getItem('sb_token'); if (t) h['Authorization'] = 'Bearer ' + t; } catch (_) {}
  return h;
}
async function reload() {
  const r = await fetch(API + '/share/' + encodeURIComponent(window._token), { headers: shareHeaders() });
  if (r.ok) { const d = await r.json(); window._wl = d.wishlist || []; const wl = $('wl'); if (wl) wl.innerHTML = wishRows(window._wl); }
}
function askClaim(id) {
  const w = (window._wl || []).find(x => x.id === id); if (!w) return;
  let name = ''; try { name = localStorage.getItem('sb_guest_name') || ''; } catch (_) {}
  const n = normTitle(w.title, w.shop);
  const box = document.createElement('div'); box.className = 'dlg';
  box.innerHTML = `<div role="dialog" aria-modal="true" aria-labelledby="dlgT"><h3 id="dlgT">Я подарю: ${esc(n.name)}</h3>
    ${w.size ? `<p>Размер: <b>${esc(w.size)}</b>${w.color ? ' · цвет: ' + esc(w.color) : ''}</p>` : ''}
    ${TGA() ? `<p>Другие гости увидят, что вещь забронировали вы — <b>${esc(window._me || 'ваш аккаунт Telegram')}</b>. Именинник не узнает. Отменить бронь можно здесь же.</p>`
    : `<label>КАК ВАС ЗОВУТ · НЕОБЯЗАТЕЛЬНО<input id="dlgName" maxlength="40" value="${esc(name)}" placeholder="Например, Мария" autocomplete="given-name"></label>
    <p>Другие гости увидят, что вещь уже дарят, и ваше имя. Владелец списка не узнает. Отменить можно с этого телефона.</p>`}
    <p id="dlgErr" style="color:#b42318"></p>
    <button class="go" id="dlgGo">Да, я подарю</button><button class="no" id="dlgNo">Отмена</button></div>`;
  document.body.appendChild(box);
  const close = () => box.remove();
  box.addEventListener('click', e => { if (e.target === box) close(); });
  $('dlgNo').onclick = close;
  $('dlgGo').onclick = async () => {
    const nm = $('dlgName') ? $('dlgName').value.trim() : ''; if ($('dlgName')) try { localStorage.setItem('sb_guest_name', nm); } catch (_) {}
    $('dlgGo').disabled = true;
    try {
      const r = await fetch(API + '/share/' + encodeURIComponent(window._token) + '/claim', { method: 'POST', headers: { ...shareHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify({ wishlist_id: id, name: nm, key: TGA() ? undefined : guestKey(), init_data: TGA() ? TGA().initData : undefined }) });
      if (r.ok) { try { TGA() && TGA().HapticFeedback.notificationOccurred('success'); } catch (_) {} }
      if (r.ok) { close(); await reload(); return; }
      const j = await r.json().catch(() => ({}));
      $('dlgErr').textContent = j.error || 'Не получилось. Попробуйте ещё раз'; $('dlgGo').disabled = false;
      if (r.status === 409) { await reload(); }
    } catch (_) { $('dlgErr').textContent = 'Нет связи. Попробуйте ещё раз'; $('dlgGo').disabled = false; }
  };
  if ($('dlgName')) setTimeout(() => $('dlgName').focus(), 50);
}
async function unclaim(id) {
  try { await fetch(API + '/share/' + encodeURIComponent(window._token) + '/unclaim', { method: 'POST', headers: { ...shareHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify({ wishlist_id: id, key: TGA() ? undefined : guestKey(), init_data: TGA() ? TGA().initData : undefined }) }); } catch (_) {}
  await reload();
}
init();
</script>
</body>

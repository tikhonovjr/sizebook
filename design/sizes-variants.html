<title>SizeBook · Варианты «Размеров»</title>
<style>
/* Layout: витрина вариантов — переключатель сверху, «телефон» с живым прототипом слева, заметки справа; на телефоне всё в одну колонку */
:root{
  --bg:#f8f7f5; --surface:#ffffff; --surface2:#f2f1ef; --line:rgba(26,26,24,.10); --line2:rgba(26,26,24,.18);
  --text:#1a1a18; --text2:#6b6b68; --text3:#9e9e9b;
  --accent:#185FA5; --accent-bg:#E6F1FB;
  --ink:#1d2430; --ink-text:#f3f1ec; --ink-dim:#9aa3b0;
  --green-bg:#EAF3DE; --green:#3B6D11; --amber-bg:#FAEEDA; --amber:#854F0B; --purple-bg:#EEEDFE; --purple:#3C3489;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 30px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141416; --surface:#1e1e21; --surface2:#28282c; --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.17);
  --text:#f2f1ee; --text2:#a8a7a3; --text3:#76756f; --accent:#6fa8e0; --accent-bg:#1b2a3a;
  --ink:#2a3445; --ink-text:#f3f1ec; --ink-dim:#a3adbb;
  --green-bg:#1f2b14; --green:#9fd06a; --amber-bg:#33260f; --amber:#e8b062; --purple-bg:#25233f; --purple:#b5adf5;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141416; --surface:#1e1e21; --surface2:#28282c; --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.17);
  --text:#f2f1ee; --text2:#a8a7a3; --text3:#76756f; --accent:#6fa8e0; --accent-bg:#1b2a3a;
  --ink:#2a3445; --ink-text:#f3f1ec; --ink-dim:#a3adbb;
  --green-bg:#1f2b14; --green:#9fd06a; --amber-bg:#33260f; --amber:#e8b062; --purple-bg:#25233f; --purple:#b5adf5;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 30px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;padding-inline:16px;padding-block:20px 40px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;display:grid;gap:20px}
.head h1{font-size:24px;font-weight:650;letter-spacing:-.02em;margin:0 0 4px;text-wrap:balance}
.head p{margin:0;color:var(--text2);max-width:62ch;line-height:1.5}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 8px;border-radius:999px;background:var(--surface);border:.5px solid var(--line2);font-weight:500}
.tab .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-size:12px;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.tab[aria-selected="true"] .n{background:var(--bg);color:var(--text)}
.stage{display:grid;grid-template-columns:392px minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:820px){.stage{grid-template-columns:minmax(0,1fr)}}
.notes{display:grid;gap:16px;min-width:0;padding-top:8px}
.notes h2{margin:0;font-size:20px;letter-spacing:-.01em}
.notes .insp{color:var(--text2);font-size:13px}
.notes p{margin:0;line-height:1.55;max-width:60ch}
.notes h3{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);font-weight:600}
.notes ul{margin:0;padding-left:18px;display:grid;gap:4px;line-height:1.5}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:480px){.pc{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--text3)}

/* ── телефон ── */
.phone{width:392px;max-width:100%;height:800px;border-radius:44px;background:var(--text);padding:10px;box-shadow:var(--shadow);justify-self:center}
.screen{position:relative;height:100%;border-radius:35px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
@media (max-width:820px){.phone{height:760px}}
@media (max-width:440px){.phone{padding:0;background:none;border-radius:24px;box-shadow:none;border:.5px solid var(--line2);width:100%}.screen{border-radius:24px}}
.status{height:44px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:13px;font-weight:600}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 20px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:.5px solid var(--line);background:var(--surface);padding:6px 0 18px}
.tabbar div{display:grid;justify-items:center;gap:2px;font-size:10px;color:var(--text3)}
.tabbar div.on{color:var(--accent)}
.lt{display:flex;justify-content:space-between;align-items:center;padding:6px 0 14px}
.lt h2{margin:0;font-size:30px;font-weight:700;letter-spacing:-.025em}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:.5px solid var(--line)}
.sec{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin:22px 4px 8px}
.ico{display:grid;place-items:center;flex:none}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap}
.d0{background:var(--green-bg);color:var(--green)}
.dp{background:var(--amber-bg);color:var(--amber)}
.dm{background:var(--purple-bg);color:var(--purple)}
.num{font-variant-numeric:tabular-nums}

/* ── шторка ── */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:86%;background:var(--surface);border-radius:22px 22px 0 0;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:6;display:flex;flex-direction:column}
.sheet.on{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line2);margin:8px auto 4px;flex:none}
.sheet .scroll{padding-top:6px}
@media (prefers-reduced-motion:reduce){.sheet,.dim,.push{transition:none!important}}

/* детальная карточка категории (общая) */
.dhead{display:flex;align-items:center;gap:12px}
.dhead .ico{width:44px;height:44px;border-radius:12px;background:var(--surface2)}
.dhead h3{margin:0;font-size:18px}
.dhead .s{color:var(--text2);font-size:13px}
.big{display:flex;align-items:baseline;gap:10px;margin:18px 0 10px}
.big b{font-size:52px;line-height:1;font-weight:700;letter-spacing:-.03em}
.big span{color:var(--text2)}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:12px;color:var(--text2);display:grid;gap:1px}
.seg button b{font-size:15px;color:var(--text);font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.rows{background:var(--surface);border-radius:14px;border:.5px solid var(--line);overflow:hidden}
.sheet .rows{background:var(--bg)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;min-height:48px}
.row+.row{border-top:.5px solid var(--line)}
.row .t{flex:1;min-width:0}
.row .t div:first-child{font-weight:500}
.row .t .s{font-size:12px;color:var(--text3);margin-top:1px}
.row .v{font-weight:600;font-variant-numeric:tabular-nums}
.row .chev{color:var(--text3)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.b{padding:12px;border-radius:12px;font-weight:600;text-align:center;background:var(--surface2)}
.b.pri{background:var(--text);color:var(--bg)}
.sw{width:30px;height:30px;border-radius:8px;flex:none}

/* V1 паспорт */
.pass{background:var(--ink);color:var(--ink-text);border-radius:22px;padding:18px 18px 8px;position:relative;overflow:hidden}
.pass .top{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.14em;color:var(--ink-dim);font-weight:600}
.pass .who{margin:14px 0 2px;font-size:22px;font-weight:650}
.pass .meta{color:var(--ink-dim);font-size:13px}
.pass .grid{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border-top:1px solid rgba(255,255,255,.12)}
.pass .cell{padding:12px 0 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,.12)}
.pass .cell:nth-child(n+4){border-bottom:0}
.pass .cell span{display:block;font-size:11px;color:var(--ink-dim)}
.pass .cell b{font-size:24px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pass .cell:active{opacity:.7}
.pass .mrz{font-family:var(--mono);font-size:9.5px;color:var(--ink-dim);letter-spacing:.08em;padding:8px 0 6px;border-top:1px solid rgba(255,255,255,.12);white-space:nowrap;overflow:hidden}
.ghosts{display:flex;flex-wrap:wrap;gap:8px}
.ghost{padding:9px 14px;border-radius:999px;border:1px dashed var(--line2);color:var(--text2);font-weight:500}
.sharebar{margin-top:14px;display:flex;gap:10px;align-items:center;background:var(--accent-bg);color:var(--accent);padding:12px 14px;border-radius:14px;font-weight:600;width:100%}

/* V2 список */
.search{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:11px;padding:9px 12px;color:var(--text3)}
.search input{border:0;background:none;flex:1;font:inherit;color:var(--text);outline:none;min-width:0}
.tile{width:30px;height:30px;border-radius:8px;color:#fff}
.empty-v{color:var(--accent);font-weight:500}
.push{position:absolute;inset:0;background:var(--bg);transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:4;display:flex;flex-direction:column}
.push.on{transform:none}
.back{display:flex;align-items:center;gap:2px;color:var(--accent);font-size:16px;padding:4px 0 10px}

/* V3 чипы + линейка */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);border:.5px solid var(--line2);font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.hero3{background:var(--surface);border-radius:20px;padding:18px;margin-top:14px;border:.5px solid var(--line)}
.ruler{background:var(--surface);border-radius:20px;padding:16px 16px 6px;margin-top:12px;border:.5px solid var(--line)}
.ruler .axis{display:grid;grid-template-columns:96px 1fr;font-size:10px;color:var(--text3);margin-bottom:4px}
.ruler .axis div:last-child{display:flex;justify-content:space-between}
.rrow{display:grid;grid-template-columns:96px 1fr;align-items:center;height:40px;border-top:.5px solid var(--line)}
.rrow .bn{font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;height:100%}
.track::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--surface2);border-radius:2px}
.track::after{content:"";position:absolute;left:50%;top:8px;bottom:8px;width:1.5px;background:var(--green);opacity:.5}
.mark{position:absolute;top:50%;transform:translate(-50%,-50%);padding:3px 8px;border-radius:999px;font-size:11px;font-weight:650;z-index:1;white-space:nowrap}
.items3{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.it3{flex:none;width:128px}
.it3 .ph{height:128px;border-radius:14px;display:grid;place-items:center;position:relative}
.it3 .ph .pill{position:absolute;left:8px;top:8px;background:var(--surface);color:var(--text)}
.it3 .nm{font-size:12px;font-weight:600;margin-top:6px}
.it3 .br{font-size:11px;color:var(--text3)}

/* V4 силуэт */
.fig{position:relative;margin:8px auto 0;width:100%;max-width:340px;aspect-ratio:340/289}
.fig svg{position:absolute;left:25%;top:0;width:50%;height:100%}
.fig .zone{cursor:pointer;transition:opacity .15s}
.call{position:absolute;display:flex;align-items:center;gap:6px;transform:translateY(-50%)}
.call.l{flex-direction:row-reverse;text-align:right}
.call .lab{background:var(--surface);border:.5px solid var(--line2);border-radius:12px;padding:5px 10px;box-shadow:var(--shadow);display:grid}
.call .lab span{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.call .lab b{font-size:17px;font-variant-numeric:tabular-nums}
.call .lab.empty b{color:var(--accent);font-size:13px;font-weight:600}
.call i{display:block;height:1px;width:22px;background:var(--line2)}
.call:hover .lab,.call.hl .lab{border-color:var(--accent)}

/* V5 гардероб */
.strip{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.sz{flex:none;background:var(--surface);border:.5px solid var(--line);border-radius:14px;padding:8px 12px;display:grid;text-align:left}
.sz span{font-size:11px;color:var(--text3)}
.sz b{font-size:18px;font-variant-numeric:tabular-nums}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.wi{text-align:left;display:grid;gap:4px}
.wi .ph{aspect-ratio:1;border-radius:16px;display:grid;place-items:center;position:relative;max-width:100%}
.wi .ph .szb{position:absolute;right:8px;bottom:8px;background:var(--surface);color:var(--text);font-weight:700;font-size:13px;padding:3px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.wi .nm{font-weight:600;font-size:13px}
.wi .br{font-size:12px;color:var(--text3);display:flex;gap:6px;align-items:center}
.wi.add .ph{border:1.5px dashed var(--line2);color:var(--text3);background:none}
</style>

<div class="wrap">
  <header class="head">
    <h1>Страница «Размеры»: 5 вариантов</h1>
    <p>Живые прототипы на примерных данных: нажимай на размеры, бренды и вещи. Текущая страница остаётся основной, это витрина для выбора.</p>

  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="stage">
    <div class="phone"><div class="screen" id="screen"></div></div>

  </div>
</div>

<script>
const ICONS={
 tee:'<path d="M15 4l6 3-2 4-2-1v10H7V10l-2 1-2-4 6-3a3 3 0 0 0 6 0z"/>',

 coat:'<path d="M9 3l3 3 3-3 4 2 1 15h-5V9l-3 4-3-4v11H4L5 5z"/>',

 chev:'<path d="M9 6l6 6-6 6"/>', back:'<path d="M15 6l-6 6 6 6"/>', plus:'<path d="M12 5v14M5 12h14"/>',

const TINT={tops:'#3f74ad',bottoms:'#5b4bb5',outer:'#8a6a3d',shoes:'#4c7a2a',hats:'#a2513f',ring:'#9a7a1d',belt:'#6b6b68',swim:'#2c8a8a',gloves:'#7a4a6e'};

const ME={name:'Иван Тихонов',h:182,w:78,fit:'Обычная посадка'};
const CATS=[
 {id:'tops',title:'Футболки и рубашки',short:'Верх',group:'Одежда',icon:'tee',base:'M',sub:'RU 48 · EU 48',sys:[['INT','M'],['RU','48'],['EU','48'],['US','38']],

 {id:'bottoms',title:'Джинсы и брюки',short:'Низ',group:'Одежда',icon:'pants',base:'32/32',sub:'W32 L32 · RU 48',sys:[['W/L','32/32'],['RU','48'],['EU','48'],['INT','M']],

 {id:'shoes',title:'Обувь',short:'Обувь',group:'Обувь',icon:'shoe',base:'43',sub:'EU · 27,5 см по стельке',sys:[['EU','43'],['US','10'],['UK','9'],['СМ','27,5']],

 {id:'hats',title:'Головные уборы',short:'Шапка',group:'Аксессуары',icon:'hat',base:'58',sub:'обхват головы, см',sys:[['СМ','58'],['INT','M'],['US','7¼']],

 {id:'gloves',title:'Перчатки',short:'Перчатки',group:'Аксессуары',icon:'glove',base:null,sys:[],brands:[],items:[]},

const diff=d=>d===0?['= твой размер','d0']:d>0?[(d===.5?'+½':'+'+d)+' размер','dp']:[(d===-.5?'−½':'−'+Math.abs(d))+' размер','dm'];
const fitCls=f=>f==='в размер'?'d0':f==='маломерит'?'dp':'dm';
const allItems=CATS.flatMap(c=>c.items.map(i=>({cat:c.id,name:i[0],brand:i[1],size:i[2],fit:i[3],color:i[4]})));
const sysSel={};

/* ── общая детальная карточка ── */
function detailHTML(c){
  if(!c.base) return `<div class="dhead"><div class="ico" style="color:${TINT[c.id]}">${ic(c.icon,24)}</div><div><h3>${c.title}</h3><div class="s">Размер ещё не указан</div></div></div>
   <p style="color:var(--text2);line-height:1.5;margin:16px 0">Укажи размер один раз, и он появится в профиле и на странице, которую ты отправляешь друзьям.</p>
   <div class="btns"><button class="b pri">Указать размер</button><button class="b">Добавить вещь</button></div>`;
  const k=sysSel[c.id]??0, cur=c.sys[k];
  return `<div class="dhead"><div class="ico" style="color:${TINT[c.id]}">${ic(c.icon,24)}</div><div><h3>${c.title}</h3><div class="s">${c.sub}</div></div></div>
  <div class="big"><b class="num">${cur[1]}</b><span>${cur[0]}</span></div>
  <div class="seg" role="group">${c.sys.map((s,i)=>`<button aria-pressed="${i===k}" onclick="pickSys('${c.id}',${i})">${s[0]}<b>${s[1]}</b></button>`).join('')}</div>
  ${c.brands.length?`<div class="sec">В разных брендах</div><div class="rows">${c.brands.map(b=>{const[t,cl]=diff(b[2]);return `<div class="row"><div class="t"><div>${b[0]}</div>${b[3]?`<div class="s">${b[3]}</div>`:''}</div><span class="pill ${cl}">${t}</span><span class="v">${b[1]}</span></div>`}).join('')}</div>`:''}
  ${c.items.length?`<div class="sec">Мои вещи</div><div class="rows">${c.items.map(i=>`<div class="row"><div class="sw" style="background:${i[4]}"></div><div class="t"><div>${i[0]}</div><div class="s">${i[1]} · ${i[3]}</div></div><span class="v">${i[2]}</span></div>`).join('')}</div>`:''}
  <div class="btns"><button class="b">Изменить размер</button><button class="b pri">${ic('plus',14,2.4)} Бренд или вещь</button></div>`;
}
let sheetCat=null;
function openSheet(id){sheetCat=id;const s=document.getElementById('sheet');s.querySelector('.scroll').innerHTML=detailHTML(C(id));s.classList.add('on');document.getElementById('dim').classList.add('on')}
function closeSheet(){sheetCat=null;document.getElementById('sheet').classList.remove('on');document.getElementById('dim').classList.remove('on');document.querySelectorAll('.call.hl').forEach(e=>e.classList.remove('hl'))}
function pickSys(id,i){sysSel[id]=i;if(sheetCat===id)document.querySelector('#sheet .scroll').innerHTML=detailHTML(C(id));if(pushCat===id)document.querySelector('#push .scroll').innerHTML=detailHTML(C(id));if(V===3)render()}

function shell(body,{tab=0}={}){
  const tabs=[['ruler','Размеры'],['heart','Вишлист'],['share','Поделиться'],['user','Профиль']];
  return `<div class="status"><span class="num">12:14</span><span>●●● ▮</span></div>
  <div class="scroll" id="main">${body}</div>
  <nav class="tabbar">${tabs.map((t,i)=>`<div class="${i===tab?'on':''}">${ic(t[0],22)}${t[1]}</div>`).join('')}</nav>
  <div class="push" id="push"><div class="status"></div><div class="scroll"></div></div>
  <div class="dim" id="dim" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="Размер"><div class="grab"></div><div class="scroll"></div></div>`;
}
const title=(t,btn=true)=>`<div class="lt"><h2>${t}</h2>${btn?`<button class="iconbtn" aria-label="Поделиться">${ic('share',18)}</button>`:''}</div>`;

/* ── V1 Паспорт ── */
function v1(){
  const key=['tops','bottoms','outer','shoes','hats','ring'];
  return shell(`${title('Размеры')}
  <div class="pass">
    <div class="top"><span>SIZEBOOK</span><span>ПАСПОРТ РАЗМЕРОВ</span></div>
    <div class="who">${ME.name}</div>
    <div class="meta num">${ME.h} см · ${ME.w} кг · ${ME.fit.toLowerCase()}</div>
    <div class="grid">${key.map(k=>{const c=C(k);return `<button class="cell" onclick="openSheet('${k}')"><span>${c.short}</span><b>${c.base}</b></button>`}).join('')}</div>
    <div class="mrz">P&lt;SB&lt;TIKHONOV&lt;&lt;IVAN&lt;&lt;M&lt;3232&lt;L&lt;43&lt;58&lt;&lt;&lt;</div>
  </div>
  <button class="sharebar">${ic('share',18)} Отправить паспорт по ссылке</button>
  <div class="sec">Ещё не указано</div>
  <div class="ghosts">${[...empty,C('belt')].map(c=>`<button class="ghost" onclick="openSheet('${c.id}')">+ ${c.title}</button>`).join('')}</div>
  <div class="sec">Последние вещи</div>
  <div class="rows">${allItems.slice(-3).reverse().map(i=>`<button class="row" onclick="openSheet('${i.cat}')"><div class="sw" style="background:${i.color}"></div><div class="t"><div>${i.name}</div><div class="s">${i.brand} · ${i.fit}</div></div><span class="v">${i.size}</span></button>`).join('')}</div>`);
}

/* ── V2 Список ── */
let pushCat=null,q='';
function v2list(){
  const groups=['Одежда','Обувь','Аксессуары'];
  const ql=q.trim().toLowerCase();
  const match=c=>!ql||c.title.toLowerCase().includes(ql)||c.brands.some(b=>b[0].toLowerCase().includes(ql));
  return groups.map(g=>{const cs=CATS.filter(c=>c.group===g&&match(c));if(!cs.length)return'';
   return `<div class="sec">${g}</div><div class="rows">${cs.map(c=>`<button class="row" onclick="push('${c.id}')"><div class="ico tile" style="background:${TINT[c.id]}">${ic(c.icon,17,2)}</div><div class="t"><div>${c.title}</div><div class="s">${c.base?[c.brands.length&&c.brands.length+' бр.',c.items.length&&c.items.length+' вещ.'].filter(Boolean).join(' · ')||c.sub:'не указан'}</div></div>${c.base?`<span class="v">${c.base}</span>`:'<span class="empty-v">Указать</span>'}<span class="chev">${ic('chev',16)}</span></button>`).join('')}</div>`}).join('')||'<p style="color:var(--text3);text-align:center;margin-top:40px">Ничего не нашлось</p>';
}
function v2(){
  return shell(`${title('Размеры')}
  <label class="search">${ic('search',16)}<input id="q2" placeholder="Категория или бренд" value="${q}" oninput="q=this.value;document.getElementById('l2').innerHTML=v2list()"></label>
  <div id="l2">${v2list()}</div>
  <p class="hint" style="margin:14px 4px 0">${filled.length} из ${CATS.length} размеров заполнено</p>`);
}
function push(id){pushCat=id;const p=document.getElementById('push');p.querySelector('.scroll').innerHTML=`<button class="back" onclick="unpush()">${ic('back',20)} Размеры</button>`+detailHTML(C(id));p.classList.add('on')}
function unpush(){pushCat=null;document.getElementById('push').classList.remove('on')}

/* ── V3 Чипы + линейка ── */
let cat3='shoes';
function v3(){
  const c=C(cat3);const k=sysSel[c.id]??0;
  const pos=d=>50+d*40;
  const body=!c.base?`<div class="hero3">${detailHTML(c)}</div>`:`
  <div class="hero3">
    <div style="color:var(--text2);font-size:13px">Твой базовый размер</div>
    <div class="big" style="margin-top:6px"><b class="num">${c.sys[k][1]}</b><span>${c.sys[k][0]} · ${c.sub}</span></div>
    <div class="seg">${c.sys.map((s,i)=>`<button aria-pressed="${i===k}" onclick="pickSys('${c.id}',${i})">${s[0]}<b>${s[1]}</b></button>`).join('')}</div>
  </div>
  ${c.brands.length?`<div class="sec">Как садятся бренды</div>
  <div class="ruler">
    <div class="axis"><div></div><div><span>брать меньше</span><span style="color:var(--green)">${c.base}</span><span>брать больше</span></div></div>
    ${c.brands.map(b=>{const[,cl]=diff(b[2]);return `<div class="rrow"><div class="bn">${b[0]}</div><div class="track"><span class="mark pill ${cl}" style="left:${pos(b[2])}%">${b[1]}</span></div></div>`}).join('')}
  </div>`:''}
  ${c.items.length?`<div class="sec">Вещи в этом размере</div><div class="items3">${c.items.map(i=>`<div class="it3"><div class="ph" style="background:${i[4]}22"><span class="pill num">${i[2]}</span><span style="color:${i[4]==='#e9e8e3'?'#8d8b84':i[4]}">${ic(c.icon,54,1.3)}</span></div><div class="nm">${i[0]}</div><div class="br">${i[1]} · ${i[3]}</div></div>`).join('')}</div>`:''}
  <div class="btns"><button class="b">Изменить</button><button class="b pri">${ic('plus',14,2.4)} Бренд</button></div>`;
  return shell(`${title('Размеры')}
  <div class="chips">${CATS.map(x=>`<button class="chip" aria-pressed="${x.id===cat3}" onclick="cat3='${x.id}';render()">${x.short}${x.base?` <span style="opacity:.55">${x.base}</span>`:' +'}</button>`).join('')}</div>${body}`);
}

  const fill='var(--surface2)',st='var(--line2)';
  return shell(`${title('Размеры')}
  <p style="margin:-6px 0 6px;color:var(--text2)">Нажми на зону или подпись</p>
  <div class="fig">
    <svg viewBox="0 0 200 340" aria-hidden="true">
      <g fill="${fill}" stroke="${st}" stroke-width="1">
        <ellipse class="zone" data-z="hats" cx="100" cy="36" rx="24" ry="28"/>
        <rect x="89" y="60" width="22" height="14" rx="4"/>
        <path class="zone" data-z="tops" d="M58 76 Q50 80 47 92 L43 158 Q41 166 52 168 L148 168 Q159 166 157 158 L153 92 Q150 80 142 76 L128 72 Q114 82 100 82 Q86 82 72 72 Z"/>
        <path class="zone" data-z="outer" d="M58 78 Q42 84 36 100 L30 148 Q28 158 36 160 L46 160 Q52 158 52 148 L54 104 Q58 92 64 86 Z"/>
        <path class="zone" data-z="outer" d="M142 78 Q158 84 164 100 L170 148 Q172 158 164 160 L154 160 Q148 158 148 148 L146 104 Q142 92 136 86 Z"/>
        <ellipse class="zone" data-z="ring" cx="33" cy="168" rx="9" ry="13"/><ellipse class="zone" data-z="ring" cx="167" cy="168" rx="9" ry="13"/>
        <path class="zone" data-z="bottoms" d="M52 168 L52 188 Q52 196 62 198 L138 198 Q148 196 148 188 L148 168 Z"/>
        <path class="zone" data-z="bottoms" d="M62 196 L60 296 Q59 306 68 308 L88 308 Q96 306 96 296 L98 196 Z"/>
        <path class="zone" data-z="bottoms" d="M138 196 L140 296 Q141 306 132 308 L112 308 Q104 306 104 296 L102 196 Z"/>
        <ellipse class="zone" data-z="shoes" cx="74" cy="320" rx="17" ry="9"/><ellipse class="zone" data-z="shoes" cx="126" cy="320" rx="17" ry="9"/>
      </g>
    </svg>
    ${calls.map(([id,side,y])=>{const c=C(id);return `<button class="call ${side}" data-c="${id}" style="top:${y}%;${side==='r'?'right:0':'left:0'}" onclick="hl4('${id}')"><span class="lab ${c.base?'':'empty'}"><span>${c.short}</span><b>${c.base??'+ указать'}</b></span><i></i></button>`}).join('')}
  </div>
  <div class="sec">Профиль</div>
  <div class="rows"><div class="row"><div class="t"><div>Рост и вес</div></div><span class="v num">${ME.h} см · ${ME.w} кг</span></div></div>`);
}
function hl4(id){document.querySelectorAll('.call').forEach(e=>e.classList.toggle('hl',e.dataset.c===id));document.querySelectorAll('.fig .zone').forEach(z=>z.setAttribute('fill',z.dataset.z===id?'var(--accent-bg)':'var(--surface2)'));openSheet(id)}

/* ── V5 Гардероб ── */
let f5='all';
function v5(){
  const cats=['all',...new Set(allItems.map(i=>i.cat))];
  const list=allItems.filter(i=>f5==='all'||i.cat===f5);
  return shell(`${title('Гардероб')}
  <div class="strip">${filled.map(c=>`<button class="sz" onclick="openSheet('${c.id}')"><span>${c.short}</span><b>${c.base}</b></button>`).join('')}</div>
  <div class="chips" style="margin-top:14px">${cats.map(k=>`<button class="chip" aria-pressed="${k===f5}" onclick="f5='${k}';render()">${k==='all'?'Все вещи · '+allItems.length:C(k).short}</button>`).join('')}</div>
  <div class="wgrid">
   ${list.map(i=>{const c=C(i.cat);const dark=['#33312e','#3d4650','#3a4a6b'].includes(i.color);return `<button class="wi" onclick="openSheet('${i.cat}')"><div class="ph" style="background:${i.color}"><span style="color:${dark?'#ffffffcc':'#00000055'}">${ic(c.icon,64,1.2)}</span><span class="szb">${i.size}</span></div><div class="nm">${i.name}</div><div class="br">${i.brand}<span class="pill ${fitCls(i.fit)}">${i.fit}</span></div></button>`}).join('')}
   <button class="wi add"><div class="ph">${ic('plus',28)}<span style="position:absolute;bottom:14px;font-size:12px">Ссылка, фото или вручную</span></div></button>
  </div>`);
}

  cons:['Без фото вещей выглядит пусто','Главный вопрос «какой у меня размер» отходит на второй план']},

let V=1;
function render(){
  const s=document.getElementById('screen');const sc=s.querySelector('#main');const top=sc?sc.scrollTop:0;
  s.innerHTML=[v1,v2,v3,v4,v5][V-1]();
  if(sc&&keepScroll)s.querySelector('#main').scrollTop=top;keepScroll=true;
  if(V===2&&q){const i=document.getElementById('q2');i.focus();i.setSelectionRange(q.length,q.length)}
}
let keepScroll=false;
function setV(n){V=n;keepScroll=false;sheetCat=null;pushCat=null;
  try{localStorage.setItem('sb_variant',n)}catch(e){}
  document.querySelectorAll('.tab').forEach((t,i)=>t.setAttribute('aria-selected',i+1===n));
  const m=V_META[n-1];
  document.getElementById('notes').innerHTML=`<div><h2>${n}. ${m.name}</h2><div class="insp">Похоже на: ${m.insp}</div></div><p>${m.idea}</p>
  <div class="pc"><div><h3>Сильные стороны</h3><ul>${m.pros.map(x=>`<li>${x}</li>`).join('')}</ul></div><div><h3>Слабые стороны</h3><ul>${m.cons.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>
  <p class="hint">Данные примерные. В любом варианте нажатие на размер открывает подробности: системы EU/US/UK/см, размер в каждом бренде и вещи.</p>`;
  render();}
document.getElementById('tabs').innerHTML=V_META.map((m,i)=>`<button class="tab" role="tab" onclick="setV(${i+1})"><span class="n">${i+1}</span>${m.name}</button>`).join('');
let saved=1;try{saved=+localStorage.getItem('sb_variant')||1}catch(e){}
setV(saved>=1&&saved<=5?saved:1);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();unpush()}});
</script>

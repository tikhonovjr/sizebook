name: Deep Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for deploy
        run: sleep 180

      - name: Run deep probe
        run: |
          BASE="https://desirable-cat-production-6c28.up.railway.app"
          curl -sf --max-time 120 "$BASE/debug/deep-probe?nm=1510075000&ozon=3148849655" \
            > deep_probe.json 2>/dev/null || echo '{"error":"probe_failed"}' > deep_probe.json
          python3 -m json.tool deep_probe.json || cat deep_probe.json

      - name: Commit
        run: |
          git config user.email "parse-bot@sizebook.local"
          git config user.name "Parse Test Bot"
          git add deep_probe.json
          git diff --staged --quiet || (git commit -m "probe: deep probe results [skip ci]" && git push)

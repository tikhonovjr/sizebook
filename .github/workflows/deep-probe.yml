name: Deep Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for deploy
        run: sleep 150
      - name: Ozon variants (separate calls, paced)
        run: |
          BASE="https://desirable-cat-production-6c28.up.railway.app"
          echo "{" > deep_probe.json
          for v in 1 2 3 4; do
            echo "--- variant $v ---"
            R=$(curl -sf --max-time 120 "$BASE/debug/probe5?v=$v" 2>/dev/null || echo '{"error":"call_failed"}')
            echo "$R"
            echo "\"v$v\": $R," >> deep_probe.json
            sleep 20
          done
          echo "\"done\": true }" >> deep_probe.json
          python3 -c "
          import json
          raw = open('deep_probe.json').read()
          try:
              d = json.loads(raw)
          except Exception as e:
              d = {'parse_error': str(e), 'raw': raw[:2000]}
          json.dump(d, open('deep_probe.json','w'), ensure_ascii=False, indent=1)
          print(json.dumps(d, ensure_ascii=False, indent=1)[:1500])
          "
      - name: Commit with retry
        run: |
          git config user.email "parse-bot@sizebook.local"
          git config user.name "Parse Test Bot"
          for i in 1 2 3; do
            git fetch origin main
            git reset --soft origin/main
            git add -f deep_probe.json
            git diff --staged --quiet && { echo "no changes"; exit 0; }
            git commit -m "probe: ozon variants [skip ci]"
            git push origin HEAD:main && { echo pushed; exit 0; }
            sleep 5
          done
          exit 1

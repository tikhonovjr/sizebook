name: Probe Wishlist Rows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch rows
        run: |
          curl -s -m 60 "https://desirable-cat-production-6c28.up.railway.app/debug/wl" | tee wl_rows.json
      - name: Push results
        run: |
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan probe-wl
          git rm -rf . -q || true
          git add wl_rows.json || true
          git commit -qm "wl rows" && git push -f origin probe-wl

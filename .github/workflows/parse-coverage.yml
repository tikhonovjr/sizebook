name: Parse Coverage

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Coverage probe
        run: |
          python3 - <<'PYEOF'
          import json, time, urllib.request, urllib.parse
          from concurrent.futures import ThreadPoolExecutor
          BASE = "https://desirable-cat-production-6c28.up.railway.app"
          q = lambda u: urllib.parse.quote(u, safe="")
          URLS = json.loads('''{"wildberries.ru":"https://www.wildberries.ru/catalog/176566362/detail.aspx","ozon.ru":"https://www.ozon.ru/product/krossovki-nike-2292301192/","lamoda.ru":"https://www.lamoda.ru/p/rtladq279101/shoes-newbalance-krossovki/","market.yandex.ru":"https://market.yandex.ru/product--futbolka-ivcapriz/1098415872?sku=102252020555&uniqueId=69979524","sportmaster.ru":"https://www.sportmaster.ru/product/39936790299/","aliexpress.ru":"https://aliexpress.ru/item/1005005582450490.html","gloria-jeans.ru":"https://www.gloria-jeans.ru/product/GJN037497-1/Serye-pramye-dzinsy","befree.ru":"https://befree.ru/zhenskaya/product/BF2441414019/50","sela.ru":"https://www.sela.ru/eshop/men/dzhempery/dzhempery/5802110635_2/","12storeez.com":"https://12storeez.com/catalog/plata/womencollection/plate-iz-shelka-126639","brandshop.ru":"https://brandshop.ru/goods/494666/mr530adc/","street-beat.ru":"https://street-beat.ru/d/krossovki-street-beat-snkm10024-100/","tsum.ru":"https://www.tsum.ru/product/6405687-khlopkovye-boksery-tom-ford-temno-seryi/","detmir.ru":"https://www.detmir.ru/product/index/id/6197460/","kupivip.ru":"https://kupivip.ru/product/plate-patrizia-pepe-85888-zheltyy/","ru.puma.com":"https://ru.puma.com/puma-r78-373117-01.html","bask.ru":"https://bask.ru/catalog/kurtka-bask-taimyr-v3-19h08/","farfetch.com":"https://www.farfetch.com/shopping/women/swear-element-sneakers-item-14612856.aspx","asos.com":"https://www.asos.com/us/asos-design/asos-design-essentials-muscle-fit-t-shirt-in-black/prd/203291724","hm.com":"https://www2.hm.com/en_us/productpage.1227157019.html","uniqlo.com":"https://www.uniqlo.com/us/en/products/E470067-000/00","net-a-porter.com":"https://www.net-a-porter.com/en-us/shop/product/anine-bing/clothing/midi-dresses/chloe-silk-satin-maxi-dress/1647597311244139","ssense.com":"https://www.ssense.com/en-us/men/product/nike/gray-dunk-low-sneakers/11885161","nike.com":"https://www.nike.com/t/air-force-1-07-mens-shoes-DZejrQoC","amazon.com":"https://www.amazon.com/True-Classic-Mens-T-Shirts-Novelty/dp/B0FNN4R5H6"}''')
          def call(path):
              t = time.time()
              try:
                  with urllib.request.urlopen(BASE + path, timeout=100) as r:
                      b = json.loads(r.read().decode("utf-8", "replace"))
              except Exception as e:
                  b = {"error": str(e)[:100]}
              b["wall_ms"] = int((time.time() - t) * 1000)
              return b
          def slim(b):
              return {k: b.get(k) for k in ("http","status","ms","cost","title","price","image","error","head") if b.get(k) is not None}
          def one(item):
              host, url = item
              req = urllib.request.Request(BASE + "/parse", data=json.dumps({"url": url}).encode(), headers={"Content-Type": "application/json"})
              t = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      b = json.loads(r.read().decode("utf-8", "replace"))
              except Exception as e:
                  b = {"error": str(e)[:100]}
              res = {"wall_ms": int((time.time() - t) * 1000), "title": (b.get("title") or "")[:50], "price": b.get("price"), "image": bool(b.get("image")), "steps": [s.get("label") for s in b.get("_steps", [])], "error": b.get("error")}
              print(host, json.dumps(res, ensure_ascii=False), flush=True)
              return host, res
          with ThreadPoolExecutor(4) as ex:
              out = dict(ex.map(one, URLS.items()))
          json.dump(out, open("parse_coverage.json", "w"), ensure_ascii=False, indent=1)
          PYEOF
      - name: Push results
        run: |
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan probe-cov2
          git rm -rf . -q || true
          git add parse_coverage.json || true
          git commit -qm "coverage results" && git push -f origin probe-cov2

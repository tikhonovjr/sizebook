name: Probe Speed

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run experiments against prod /debug endpoints
        run: |
          python3 - <<'PYEOF'
          import json, time, urllib.request, urllib.parse
          BASE = "https://desirable-cat-production-6c28.up.railway.app"
          FF  = "https://www.farfetch.com/uk/shopping/women/salomon-xt-6-item-33433630.aspx"
          WBU = "https://www.wildberries.ru/catalog/1510075000/detail.aspx"
          OZ  = "https://www.ozon.ru/product/noski-muzhskie-muzhskie-5-par-3148849655/"
          SM  = "https://www.sportmaster.ru/"
          S12 = "https://12storeez.com/"
          WBJ2 = "https://card.wb.ru/cards/v2/detail?appType=1&curr=rub&dest=-1257786&spp=30&nm=1510075000"
          WBJ1 = "https://card.wb.ru/cards/v1/detail?appType=1&curr=rub&dest=-1257786&spp=30&nm=1510075000"
          def call(path, timeout=100):
              t = time.time()
              try:
                  with urllib.request.urlopen(BASE + path, timeout=timeout) as r:
                      body = json.loads(r.read().decode("utf-8", "replace"))
              except Exception as e:
                  body = {"error": str(e)[:150]}
              return {"wall_ms": int((time.time() - t) * 1000), **body}
          q = urllib.parse.quote
          out = {"started": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "firecrawl": {}, "ua": {}}
          fc = [
            ("ff_wf4000_nocache", FF, "wf=4000&maxAge=0"),
            ("ff_wf0_nocache",    FF, "wf=0&maxAge=0"),
            ("ff_wf1500_nocache", FF, "wf=1500&maxAge=0"),
            ("ff_wf2500_nocache", FF, "wf=2500&maxAge=0"),
            ("ff_wf4000_cache_a", FF, "wf=4000"),
            ("ff_wf4000_cache_b", FF, "wf=4000"),
            ("wb_page_wf6000_RU", WBU, "wf=6000&loc=RU&maxAge=0"),
            ("wb_page_wf1500_RU", WBU, "wf=1500&loc=RU&maxAge=0"),
            ("wb_page_wf0_RU",    WBU, "wf=0&loc=RU&maxAge=0"),
            ("wb_json_v2_RU",     WBJ2, "wf=0&loc=RU&maxAge=0&raw=1"),
            ("wb_json_v1_RU",     WBJ1, "wf=0&loc=RU&maxAge=0&raw=1"),
            ("wb_json_v2_noloc",  WBJ2, "wf=0&maxAge=0&raw=1"),
          ]
          for name, url, params in fc:
              out["firecrawl"][name] = call("/debug/fcspeed?url=%s&%s" % (q(url, safe=""), params))
              print(name, json.dumps(out["firecrawl"][name], ensure_ascii=False)[:300], flush=True)
              time.sleep(7)
          targets = {"farfetch": FF, "wb_page": WBU, "ozon": OZ, "sportmaster_home": SM, "12storeez_home": S12}
          for tname, url in targets.items():
              out["ua"][tname] = {}
              for ua in ["chrome", "tg", "fb", "google", "wa"]:
                  out["ua"][tname][ua] = call("/debug/uaprobe?url=%s&ua=%s" % (q(url, safe=""), ua), timeout=30)
                  print(tname, ua, json.dumps(out["ua"][tname][ua], ensure_ascii=False)[:200], flush=True)
          json.dump(out, open("/tmp/speed_results.json", "w"), ensure_ascii=False, indent=2)
          PYEOF
      - name: Publish results to probe-results branch
        run: |
          git config user.email "probe-bot@sizebook.local"
          git config user.name "Probe Bot"
          mkdir -p /tmp/out && cp /tmp/speed_results.json /tmp/out/speed_results.json
          git checkout --orphan probe-results
          git rm -rf . -q
          cp /tmp/out/speed_results.json speed_results.json
          git add speed_results.json
          git commit -q -m "probe: speed results $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f origin probe-results

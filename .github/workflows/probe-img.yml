name: Probe Images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check parse + image fetch
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, urllib.error
          BASE = "https://desirable-cat-production-6c28.up.railway.app"
          URLS = [
            "https://12storeez.com/catalog/verhnaa-odezda/womencollection/puhovik-repino-s-vorotnikom-iz-meha-139725",
            "https://www.tsum.ru/product/7128763-palto-iz-shersti-i-kashemira-brunello-cucinelli-seryi/",
          ]
          UA = "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          def head(url, referer=None):
              h = {"User-Agent": UA, "Accept": "image/avif,image/webp,image/*,*/*;q=0.8"}
              if referer: h["Referer"] = referer
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=20) as r:
                      return {"status": r.status, "type": r.headers.get("content-type"), "len": r.headers.get("content-length")}
              except urllib.error.HTTPError as e:
                  return {"status": e.code}
              except Exception as e:
                  return {"error": str(e)[:100]}
          out = {}
          for u in URLS:
              req = urllib.request.Request(BASE + "/parse", data=json.dumps({"url": u}).encode(), headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=120) as r:
                  b = json.loads(r.read().decode())
              img = b.get("image")
              res = {"parse": {k: b.get(k) for k in ("title", "price", "image")}, "steps": [s.get("label") for s in b.get("_steps", [])]}
              if img:
                  res["img_no_referer"] = head(img)
                  res["img_with_site_referer"] = head(img, BASE + "/")
              out[u] = res
              print(json.dumps(res, ensure_ascii=False), flush=True)
          json.dump(out, open("img_results.json", "w"), ensure_ascii=False, indent=1)
          PYEOF
      - name: Push results
        run: |
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan probe-img
          git rm -rf . -q || true
          git add img_results.json || true
          git commit -qm "img results" && git push -f origin probe-img

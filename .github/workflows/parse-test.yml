name: Parse Test Loop

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-parser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for Railway deploy
        run: sleep 150

      - name: Test and save results
        run: |
          BASE="https://desirable-cat-production-6c28.up.railway.app"
          COMMIT="${{ github.sha }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          test_site() {
            NAME=$1; URL=$2
            T0=$(date +%s%3N)
            RESULT=$(curl -sf --max-time 55 -X POST "$BASE/parse" \
              -H "Content-Type: application/json" \
              -d "{\"url\":\"$URL\"}" 2>&1) || RESULT='{"error":"curl_failed"}'
            T1=$(date +%s%3N)
            MS=$((T1-T0))
            echo "{\"site\":\"$NAME\",\"ms\":$MS,\"r\":$RESULT}"
          }

          O=$(test_site "ozon"         "https://www.ozon.ru/product/noski-muzhskie-muzhskie-5-par-3148849655/")
          W=$(test_site "wildberries"  "https://www.wildberries.ru/catalog/1510075000/detail.aspx")
          F=$(test_site "farfetch"     "https://www.farfetch.com/uk/shopping/women/salomon-xt-6-item-33433630.aspx")
          S=$(test_site "12storeez"    "https://12storeez.com/catalog/platya/letnee-plate-iz-viskoza/")

          python3 - "$COMMIT" "$TIMESTAMP" <<PYEOF
          import sys, json

          commit = sys.argv[1][:7]
          ts     = sys.argv[2]

          raw = [
            $O,
            $W,
            $F,
            $S,
          ]

          def score(r):
              res = r.get("r", {})
              if not isinstance(res, dict):
                  return {"ok": False, "error": str(res)[:200]}
              return {
                  "title": bool(res.get("title")),
                  "price": bool(res.get("price")),
                  "image": bool(res.get("image")),
                  "ms":    r["ms"],
                  "steps": res.get("_steps", []),
                  "title_val": res.get("title","")[:80],
                  "price_val": res.get("price",""),
              }

          out = {
              "commit": commit,
              "timestamp": ts,
              "scorecard": {r["site"]: score(r) for r in raw}
          }

          with open("test_results.json","w") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)

          for site, s in out["scorecard"].items():
              ok = all([s.get("title"), s.get("image")])
              print(f"[{site}] title={s.get('title')} price={s.get('price')} image={s.get('image')} {s.get('ms')}ms {'✓' if ok else '✗'}")
          PYEOF

      - name: Commit results
        run: |
          git config user.email "parse-bot@sizebook.local"
          git config user.name "Parse Test Bot"
          git add test_results.json
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "test: results $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]" && git push

name: Parse Test Loop

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-parser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for Railway deploy
        run: sleep 180

      - name: Proxy diagnostics + parse tests
        run: |
          BASE="https://desirable-cat-production-6c28.up.railway.app"

          echo "=== PROXY CHECK ==="
          curl -sf --max-time 20 "$BASE/debug/proxy-check" \
            > /tmp/proxy_check.json 2>/dev/null && cat /tmp/proxy_check.json || echo '{"error":"endpoint_failed"}' > /tmp/proxy_check.json

          echo ""
          echo "=== PARSE TESTS ==="
          curl -sf --max-time 60 -X POST "$BASE/parse" \
            -H "Content-Type: application/json" \
            -d '{"url":"https://www.ozon.ru/product/noski-muzhskie-muzhskie-5-par-3148849655/"}' \
            > /tmp/ozon.json 2>/tmp/ozon.err || echo '{"error":"curl_failed"}' > /tmp/ozon.json

          curl -sf --max-time 60 -X POST "$BASE/parse" \
            -H "Content-Type: application/json" \
            -d '{"url":"https://www.wildberries.ru/catalog/1510075000/detail.aspx"}' \
            > /tmp/wb.json 2>/tmp/wb.err || echo '{"error":"curl_failed"}' > /tmp/wb.json

          curl -sf --max-time 60 -X POST "$BASE/parse" \
            -H "Content-Type: application/json" \
            -d '{"url":"https://www.farfetch.com/uk/shopping/women/salomon-xt-6-item-33433630.aspx"}' \
            > /tmp/ff.json 2>/tmp/ff.err || echo '{"error":"curl_failed"}' > /tmp/ff.json

          curl -sf --max-time 30 -X POST "$BASE/parse" \
            -H "Content-Type: application/json" \
            -d '{"url":"https://12storeez.com/catalog/platya/plate-midi-iz-shelka/"}' \
            > /tmp/s12.json 2>/tmp/s12.err || echo '{"error":"curl_failed"}' > /tmp/s12.json

      - name: Build scorecard
        run: |
          python3 - << 'PYEOF'
          import json
          from datetime import datetime

          # Сохраняем proxy check
          try:
              with open('/tmp/proxy_check.json') as f:
                  pc = json.load(f)
              with open('proxy_check.json', 'w') as f:
                  json.dump(pc, f, ensure_ascii=False, indent=2)
              print("PROXY:", json.dumps(pc, ensure_ascii=False))
          except Exception as e:
              print("proxy_check error:", e)

          sites = [
            ("ozon",        "/tmp/ozon.json"),
            ("wildberries", "/tmp/wb.json"),
            ("farfetch",    "/tmp/ff.json"),
            ("12storeez",   "/tmp/s12.json"),
          ]

          scorecard = {}
          for name, path in sites:
              try:
                  with open(path) as f:
                      r = json.load(f)
              except Exception as e:
                  r = {"error": str(e)}
              if isinstance(r, dict) and "error" not in r:
                  scorecard[name] = {
                      "title":     bool(r.get("title")),
                      "price":     bool(r.get("price")),
                      "image":     bool(r.get("image")),
                      "steps":     r.get("_steps", []),
                      "title_val": (r.get("title") or "")[:80],
                      "price_val": r.get("price") or "",
                      "ms":        r.get("_ms", 0),
                  }
              else:
                  scorecard[name] = {"error": (r.get("error","unknown") if isinstance(r,dict) else str(r))[:200]}
              s = scorecard[name]
              print(f"[{name:12}] title={'✓' if s.get('title') else '✗'} price={'✓' if s.get('price') else '✗'} image={'✓' if s.get('image') else '✗'}  {s.get('ms','?')}ms  {s.get('title_val','')[:50]}")

          out = {"timestamp": datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"), "scorecard": scorecard}
          with open("test_results.json", "w") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          PYEOF

      - name: Commit results
        run: |
          git config user.email "parse-bot@sizebook.local"
          git config user.name "Parse Test Bot"
          git add test_results.json proxy_check.json 2>/dev/null || git add test_results.json
          git diff --staged --quiet && echo "No changes" || \
            (git commit -m "test: results $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]" && git push)

name: Parse Test Loop

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-parser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for Railway deploy
        run: sleep 150

      - name: Run curl tests
        run: |
          BASE="https://desirable-cat-production-6c28.up.railway.app"

          curl -sf --max-time 60 -X POST "$BASE/parse" \
            -H "Content-Type: application/json" \
            -d '{"url":"https://www.ozon.ru/product/noski-muzhskie-muzhskie-5-par-3148849655/"}' \
            > /tmp/ozon.json 2>/tmp/ozon.err || echo '{"error":"curl_failed"}' > /tmp/ozon.json

          curl -sf --max-time 60 -X POST "$BASE/parse" \
            -H "Content-Type: application/json" \
            -d '{"url":"https://www.wildberries.ru/catalog/15974027/detail.aspx"}' \
            > /tmp/wb.json 2>/tmp/wb.err || echo '{"error":"curl_failed"}' > /tmp/wb.json

          curl -sf --max-time 60 -X POST "$BASE/parse" \
            -H "Content-Type: application/json" \
            -d '{"url":"https://www.farfetch.com/uk/shopping/women/salomon-xt-6-item-33433630.aspx"}' \
            > /tmp/ff.json 2>/tmp/ff.err || echo '{"error":"curl_failed"}' > /tmp/ff.json

          curl -sf --max-time 60 -X POST "$BASE/parse" \
            -H "Content-Type: application/json" \
            -d '{"url":"https://12storeez.com/catalog/platya/"}' \
            > /tmp/s12.json 2>/tmp/s12.err || echo '{"error":"curl_failed"}' > /tmp/s12.json

          echo "=== OZON ==="; cat /tmp/ozon.json
          echo "=== WB ==="; cat /tmp/wb.json
          echo "=== FARFETCH ==="; cat /tmp/ff.json
          echo "=== 12STOREEZ ==="; cat /tmp/s12.json

      - name: Build scorecard
        run: |
          python3 - << 'PYEOF'
          import json
          from datetime import datetime

          sites = [
            ("ozon",        "/tmp/ozon.json"),
            ("wildberries", "/tmp/wb.json"),
            ("farfetch",    "/tmp/ff.json"),
            ("12storeez",   "/tmp/s12.json"),
          ]

          scorecard = {}
          for name, path in sites:
              try:
                  with open(path) as f:
                      r = json.load(f)
              except Exception as e:
                  r = {"error": str(e)}
              if isinstance(r, dict) and "error" not in r:
                  scorecard[name] = {
                      "title":     bool(r.get("title")),
                      "price":     bool(r.get("price")),
                      "image":     bool(r.get("image")),
                      "steps":     r.get("_steps", []),
                      "title_val": (r.get("title") or "")[:80],
                      "price_val": r.get("price") or "",
                      "ms":        r.get("_ms", 0),
                  }
              else:
                  scorecard[name] = {"error": (r.get("error", "unknown") if isinstance(r, dict) else str(r))[:200]}
              s = scorecard[name]
              t = "✓" if s.get("title") else "✗"
              p = "✓" if s.get("price") else "✗"
              i = "✓" if s.get("image") else "✗"
              ms = s.get("ms", "?")
              print(f"[{name:12}] title{t} price{p} image{i}  {ms}ms  {s.get('title_val','')[:40]}")

          out = {
              "timestamp": datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              "scorecard": scorecard
          }
          with open("test_results.json", "w") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          print("Saved test_results.json")
          PYEOF

      - name: Commit results
        run: |
          git config user.email "parse-bot@sizebook.local"
          git config user.name "Parse Test Bot"
          git add test_results.json
          git diff --staged --quiet && echo "No changes" || \
            (git commit -m "test: results $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]" && git push)

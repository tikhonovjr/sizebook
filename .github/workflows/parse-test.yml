name: Parse Test Loop

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-parser:
    runs-on: ubuntu-latest
    # Ждём Railway деплой (обычно 2-3 минуты)
    steps:
      - name: Wait for Railway deploy
        run: sleep 150

      - name: Run parse tests
        id: tests
        run: |
          BASE="https://desirable-cat-production-6c28.up.railway.app"
          
          run_test() {
            local name="$1"
            local url="$2"
            local start=$(date +%s%3N)
            local result=$(curl -s --max-time 60 -X POST "$BASE/parse" \
              -H "Content-Type: application/json" \
              -d "{\"url\":\"$url\"}" 2>&1)
            local end=$(date +%s%3N)
            local elapsed=$((end - start))
            echo "{\"site\":\"$name\",\"url\":\"$url\",\"elapsed_ms\":$elapsed,\"result\":$result}"
          }
          
          echo "[" > /tmp/results.json
          
          r1=$(run_test "ozon" "https://www.ozon.ru/product/noski-muzhskie-muzhskie-5-par-3148849655/")
          echo "$r1," >> /tmp/results.json
          
          r2=$(run_test "wildberries" "https://www.wildberries.ru/catalog/1510075000/detail.aspx")
          echo "$r2," >> /tmp/results.json
          
          r3=$(run_test "farfetch" "https://www.farfetch.com/uk/shopping/women/salomon-xt-6-item-33433630.aspx")
          echo "$r3," >> /tmp/results.json
          
          r4=$(run_test "12storeez" "https://12storeez.com/catalog/1234/")
          echo "$r4" >> /tmp/results.json
          
          echo "]" >> /tmp/results.json
          
          # Добавляем метаданные
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT="${{ github.sha }}"
          python3 -c "
          import json, sys
          with open(\"/tmp/results.json\") as f:
              raw = f.read()
          # Убираем trailing comma перед ]
          raw = raw.replace(\",
]\", \"
]\")
          try:
              results = json.loads(raw)
          except:
              results = [{\"parse_error\": raw[:500]}]
          
          summary = {
              \"commit\": \"${COMMIT}\"[:7],
              \"timestamp\": \"${TIMESTAMP}\",
              \"results\": results,
              \"scorecard\": {}
          }
          
          for r in results:
              site = r.get(\"site\", \"?\")
              res = r.get(\"result\", {})
              if isinstance(res, dict):
                  summary[\"scorecard\"][site] = {
                      \"title\": bool(res.get(\"title\")),
                      \"price\": bool(res.get(\"price\")),
                      \"image\": bool(res.get(\"image\")),
                      \"ms\": r.get(\"elapsed_ms\"),
                      \"steps\": res.get(\"_steps\", [])
                  }
              else:
                  summary[\"scorecard\"][site] = {\"error\": str(res)[:200]}
          
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          " > /tmp/summary.json
          
          cat /tmp/summary.json

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit test results
        run: |
          git config user.email "parse-bot@sizebook.local"
          git config user.name "Parse Test Bot"
          cp /tmp/summary.json test_results.json
          git add test_results.json
          git diff --staged --quiet || git commit -m "test: parse results $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push


name: Probe Scrape.do

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Scrape.do probes
        run: |
          python3 - <<'PYEOF'
          import json, time, urllib.request, urllib.parse
          BASE = "https://desirable-cat-production-6c28.up.railway.app"
          q = urllib.parse.quote
          URLS = {
            "wb":   "https://www.wildberries.ru/catalog/1510075000/detail.aspx",
            "ozon": "https://www.ozon.ru/product/noski-muzhskie-muzhskie-5-par-3148849655/",
            "sm":   "https://www.sportmaster.ru/product/36415340299/",
            "ff":   "https://www.farfetch.com/uk/shopping/women/salomon-xt-6-item-33433630.aspx",
            "12s":  "https://12storeez.com/",
          }
          MODES = [
            ("plain",       ""),
            ("render",      "&render=1"),
            ("super_ru",    "&super=1&geo=ru"),
            ("render_super_ru", "&render=1&super=1&geo=ru"),
          ]
          def call(path):
              t = time.time()
              try:
                  with urllib.request.urlopen(BASE + path, timeout=100) as r:
                      b = json.loads(r.read().decode("utf-8", "replace"))
              except Exception as e:
                  b = {"error": str(e)[:150]}
              return {"wall_ms": int((time.time() - t) * 1000), **b}
          out = {}
          for name, url in URLS.items():
              out[name] = {}
              for mname, params in MODES:
                  r = call("/debug/sdprobe?url=%s%s" % (q(url, safe=""), params))
                  out[name][mname] = r
                  print(name, mname, json.dumps(r, ensure_ascii=False)[:300], flush=True)
          json.dump(out, open("sd_results.json", "w"), ensure_ascii=False, indent=1)
          PYEOF
      - name: Push results
        run: |
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan probe-sd
          git rm -rf . -q || true
          git add sd_results.json || true
          git commit -qm "sd results" && git push -f origin probe-sd

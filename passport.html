<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a9aeb6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>SizeBook · Гардероб</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="/sb-common.js"></script>
<style>
/* SizeBook в стиле термоэтикетки («Чек»). Экспериментальная версия, основная — «/» */
:root{
  --ink:#0d0d0d; --ink2:#5f6166; --ink3:#9a9ca1; --lab:#fdfdfb; --bg:#e7e8ea; --line:#c4c6ca;
  --disp:"Archivo",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--disp);-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg);padding-bottom:calc(84px + var(--safe-b))}
.num{font-variant-numeric:tabular-nums}
.view[hidden]{display:none!important}

/* шапка-пакет */
.top{padding:calc(18px + var(--safe-t)) 16px 26px;background:
  radial-gradient(60% 40% at 20% 30%,rgba(255,255,255,.55),transparent 70%),
  radial-gradient(50% 30% at 80% 70%,rgba(255,255,255,.4),transparent 70%),
  linear-gradient(160deg,#9aa0a8,#b9bec5 40%,#8f959e 60%,#aeb3ba)}
.lt{display:flex;justify-content:space-between;align-items:center;padding:0 2px 16px;gap:12px}
.lt h1{margin:0;font:900 30px var(--disp);text-transform:uppercase;letter-spacing:-.02em}
.tbtn{font:700 11px var(--mono);text-transform:uppercase;color:var(--ink);background:var(--lab);padding:6px 10px;border:2px solid var(--ink);text-decoration:none;white-space:nowrap}
.tbtn.dark{background:var(--ink);color:#fff}

/* этикетка */
.label{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;background:var(--ink);border:2px solid var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.2),0 16px 28px -14px rgba(0,0,0,.45)}
.label>*{background:var(--lab)}
.span2{grid-column:span 2}.span3{grid-column:1/-1}
.z1{padding:9px 12px;font:500 10px/1.5 var(--mono);min-width:0}
.z1 b{display:block;font:900 21px/1.05 var(--disp);text-transform:uppercase;margin:3px 0 2px;letter-spacing:-.01em;overflow-wrap:anywhere}
.route{background:var(--ink)!important;color:#fff;display:flex;flex-direction:column;justify-content:center;padding:9px 12px;font:900 42px/1 var(--disp);text-align:left}
.route small{font:500 10px var(--mono);letter-spacing:.1em;margin-bottom:4px;opacity:.85}
.cell{padding:8px 12px;text-align:left;min-height:60px;min-width:0}
.cap{display:block;font:600 9px var(--mono);text-transform:uppercase;letter-spacing:.04em}
.cell b{font:900 26px/1.1 var(--disp);letter-spacing:-.02em;overflow-wrap:anywhere}
.cell b.empty{color:#b0b2b6}
button.cell:active,button.route:active{filter:invert(1)}
.qrbox{padding:12px;display:grid;place-items:center}
.qrbox svg{width:100%;height:auto;display:block}
.qrph{width:100%;aspect-ratio:1;border:2px dashed var(--line);display:grid;place-items:center;font:600 9px var(--mono);color:var(--ink2);text-align:center;padding:4px}
.gift{padding:10px 12px;font:500 10px/1.5 var(--mono);display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.gift b{display:block;font:900 15px var(--disp);text-transform:uppercase;margin-bottom:2px}
.btn{display:inline-block;background:var(--ink);color:#fff;font:700 11px var(--mono);text-transform:uppercase;padding:8px 11px;text-decoration:none;text-align:center}
.btn.ghost{background:var(--lab);color:var(--ink);border:2px solid var(--ink);padding:6px 9px}
.btn.wide{display:block;width:100%;padding:13px}
.btn.danger{background:#b3261e}
.btn[disabled]{opacity:.45;pointer-events:none}
.gift .btn{margin-top:8px}

/* полки и списки */
.body{padding:0 16px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 4px;gap:10px}
.sec h2{margin:0;font:900 22px var(--disp);text-transform:uppercase}
.sec button{font:700 12px var(--mono);text-transform:uppercase}
.shelf{margin-top:16px}
.shead{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;padding-bottom:10px}
.shead b{font:900 15px var(--disp);text-transform:uppercase}
.shead .sz{font:600 11px var(--mono);border:2px solid var(--ink);padding:0 5px}
.shead .cnt{margin-left:auto;font:500 11px var(--mono);color:var(--ink2)}
.strip{display:flex;overflow-x:auto;scrollbar-width:none;gap:10px;margin:0 -16px;padding:0 16px}
.strip::-webkit-scrollbar{display:none}
.it{flex:none;width:118px;text-align:left}
.ph2{height:132px;background:var(--lab);display:grid;place-items:center;position:relative;overflow:hidden}
.ph2 img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.ini{font:900 34px var(--disp);color:#d4d5d8;text-transform:uppercase}
.ph2 .tg{position:absolute;right:6px;top:6px;background:#fff;border:2px solid var(--ink);font:800 12px var(--mono);padding:1px 6px}
.nm{font:700 13px var(--disp);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br{font:400 11px var(--mono);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{background:var(--lab);border:2px dashed var(--line);padding:16px;font:500 12px/1.55 var(--mono);color:var(--ink2);margin-top:12px}

/* строки-этикетки (вишлист): одинаковая высота, фото квадратом, цена в своей колонке */
.rows{display:grid;gap:2px;background:var(--ink);border:2px solid var(--ink);margin-top:12px}
.row{display:grid;grid-template-columns:84px minmax(0,1fr) 98px;gap:2px;background:var(--ink);text-align:left;width:100%;height:96px}
.row>*{background:var(--lab);min-width:0}
.th{display:grid;place-items:center;overflow:hidden;background:#fff!important;position:relative}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:6px;mix-blend-mode:multiply}
.th .ini{font-size:26px}
.row .tx{padding:8px 10px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.row .bd{font:700 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tt{font:800 14px/1.2 var(--disp);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .mt{font:500 10px var(--mono);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pr{padding:8px 10px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;text-align:right}
.row .pr b{font:900 15px/1.15 var(--disp);white-space:nowrap}
.row .pr span{font:500 10px var(--mono);color:var(--ink3);white-space:nowrap;margin-top:2px}
.row .pr .none{color:var(--ink3);font-weight:700}
.row.got .tt{color:var(--ink2)}
.row.got .pr b{font-size:10px;font-family:var(--mono);font-weight:700;letter-spacing:.06em}
.pending{font:600 9px var(--mono);text-transform:uppercase;color:var(--ink2);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.35}}
/* фото вещи */
.pics{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--ink);border:2px solid var(--ink);margin-top:12px}
.pic{background:#fff;position:relative;aspect-ratio:1;display:grid;place-items:center;overflow:hidden;text-align:center}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;cursor:zoom-in}
.pic.mine img{object-fit:cover}
.pics.three{grid-template-columns:repeat(3,1fr)}
.pics.three .add{font-size:9px}
.pics.three .add i{width:28px;height:28px;font-size:17px}
.pic .cap{position:absolute;left:0;top:0;background:var(--ink);color:#fff;padding:3px 6px;z-index:1}
.pic .add{font:700 10px var(--mono);text-transform:uppercase;color:var(--ink2);display:grid;gap:6px;justify-items:center}
.pic .add i{width:34px;height:34px;border:2px solid var(--ink);display:grid;place-items:center;font-style:normal;font:900 20px var(--disp);color:var(--ink)}
.pic .chg{position:absolute;right:6px;bottom:6px;background:var(--lab);border:2px solid var(--ink);font:700 9px var(--mono);text-transform:uppercase;padding:3px 6px}
.pic.busy::after{content:"ЗАГРУЖАЮ…";position:absolute;inset:0;display:grid;place-items:center;background:rgba(253,253,251,.85);font:700 10px var(--mono)}
.sw{position:relative;overflow:hidden;background:var(--ink)}
.sw .row{position:relative;z-index:1;transition:transform .22s ease;touch-action:pan-y;will-change:transform}
.sw.drag .row{transition:none}
.sw .acts2{position:absolute;top:0;right:0;bottom:0;display:flex;gap:2px;visibility:hidden}
.sw.open .acts2,.sw.drag .acts2{visibility:visible}
.acts2 button{width:83px;font:700 10px var(--mono);text-transform:uppercase;color:#fff;background:#2b2b2b}
.acts2 button.del{background:#b3261e}
.viewer{position:fixed;inset:0;z-index:30;background:rgba(10,10,10,.96);display:none;touch-action:none}
.viewer.on{display:block}
.viewer .vw{position:absolute;inset:calc(56px + var(--safe-t)) 0 calc(56px + var(--safe-b));overflow:auto;touch-action:pinch-zoom pan-x pan-y;display:grid;place-items:center}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;display:block;background:#fff}
.viewer .vx{position:absolute;right:14px;top:calc(12px + var(--safe-t));width:38px;height:38px;border:2px solid #fff;color:#fff;display:grid;place-items:center;z-index:1}
.viewer .vc{position:absolute;left:16px;top:calc(20px + var(--safe-t));font:700 10px var(--mono);text-transform:uppercase;color:#bbb}
.orig{font:500 10px/1.5 var(--mono);color:var(--ink3);margin-top:6px}
/* формы */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;background:var(--ink);border:2px solid var(--ink);margin-top:14px}
.form>*{background:var(--lab)}
.form>.btn{background:var(--ink);color:#fff;border-radius:0}
.fld{display:flex;flex-direction:column;padding:7px 10px 6px;min-width:0}
.fld input,.fld select{border:0;background:none;font:800 19px var(--disp);padding:2px 0 2px;color:var(--ink);outline:none;min-width:0;width:100%;border-radius:0;-webkit-appearance:none}
.fld input::placeholder{color:#c2c4c8}
.fld.small input{font:600 14px var(--mono)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;background:var(--ink)}
.seg button{background:var(--lab);padding:11px 4px;font:700 10px var(--mono);text-transform:uppercase;text-align:center}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.chk{display:flex;align-items:center;gap:10px;padding:12px;text-align:left;width:100%}
.chk i{width:20px;height:20px;border:2px solid var(--ink);flex:none;display:grid;place-items:center}
.chk[aria-checked="true"] i{background:var(--ink)}
.chk[aria-checked="true"] i::after{content:"";width:8px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.chk span{font:700 13px var(--disp)}
.chk small{display:block;font:500 10px var(--mono);color:var(--ink2);margin-top:1px}
.msg{font:500 11px var(--mono);color:var(--ink2);margin-top:8px;min-height:16px}
.msg.err{color:#b3261e}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acts .btn{flex:1}
.url{font:600 12px var(--mono);word-break:break-all;padding:12px}

/* нижняя панель «Чек» */
.tb{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:5;background:var(--lab);border-top:2px solid var(--ink);padding-bottom:var(--safe-b);display:grid;grid-template-columns:repeat(4,1fr)}
.tb button{display:block;text-align:center;padding:17px 0 15px;font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);border-right:2px solid var(--ink)}
.tb button:last-child{border-right:0}
.tb button[aria-current="page"]{background:var(--ink);color:#fff}

/* шторка со свайпом */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:8}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:480px;max-height:88vh;transform:translate(-50%,105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:9;display:flex;flex-direction:column;background:var(--bg);border-top:3px solid var(--ink);will-change:transform}
.sheet.on{transform:translate(-50%,0)}
.sheet.drag{transition:none}
.sh-head{flex:none;padding:8px 16px 4px;touch-action:none;cursor:grab;display:grid;grid-template-columns:1fr auto;align-items:start;gap:10px}
.grab{grid-column:1/-1;width:44px;height:5px;margin:0 auto 6px;background:var(--ink);opacity:.3}
.sh-head h3{margin:0;font:900 24px/1.1 var(--disp);text-transform:uppercase;overflow-wrap:anywhere}
.x{width:32px;height:32px;border:2px solid var(--ink);background:var(--lab);display:grid;place-items:center;flex:none}
.sheet .in{overflow-y:auto;overscroll-behavior:contain;padding:0 16px calc(24px + var(--safe-b))}
.sub{font:500 11px var(--mono);color:var(--ink2)}
.sysrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.sysrow span{background:var(--lab);border:2px solid var(--ink);padding:6px 10px;font:900 18px var(--disp)}
.sysrow span i{font:600 10px var(--mono);font-style:normal;margin-right:6px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.sgrid button{text-align:left}
.sgrid .ph2{height:auto;aspect-ratio:1}
.zchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.zchips button{border:2px solid var(--ink);background:var(--lab);padding:6px 9px;font:700 10px var(--mono);text-transform:uppercase}
.zchips button[aria-pressed="true"]{background:var(--ink);color:#fff}
.big{display:block;width:100%;max-height:260px;object-fit:contain;background:var(--lab);margin-top:12px}

.tour{position:fixed;inset:0;z-index:40;display:none}
.tour.on{display:block}
.tour.hint{pointer-events:none}
.tour.hint .tcard{pointer-events:auto}
.tour .spot{position:absolute;border:3px solid #ffd400;box-shadow:0 0 0 9999px rgba(10,10,10,.62);transition:left .25s,top .25s,width .25s,height .25s;pointer-events:none}
.tour.hint .spot{box-shadow:0 0 0 9999px rgba(10,10,10,.45)}
.tour .tcard{position:absolute;left:12px;right:12px;max-width:456px;margin:0 auto;background:var(--lab);border:2px solid var(--ink);box-shadow:0 18px 40px rgba(0,0,0,.45)}
.tcard .th1{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--ink);padding:0 0 0 12px;font:700 10px var(--mono);text-transform:uppercase;letter-spacing:.06em}
.tcard .th1 button{font:700 10px var(--mono);text-transform:uppercase;color:var(--ink2);padding:12px 12px;touch-action:manipulation}
.tcard .tb2{padding:12px 14px 4px}
.tcard h4{margin:0 0 6px;font:900 21px/1.1 var(--disp);text-transform:uppercase}
.tcard p{margin:0;font:500 15px/1.45 var(--disp);color:#2a2b2e}
.tcard p b{font-weight:800}
.tcard .bar{display:flex;gap:3px;padding:10px 14px 0}
.tcard .bar i{flex:1;height:4px;background:#d7d8db}
.tcard .bar i.on{background:var(--ink)}
.tcard .tf{display:flex;gap:8px;padding:12px 14px 14px}
.tcard .tf .btn{flex:1;padding:14px 8px;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.tcard .tf .btn[hidden]{display:none}
/* «С чего начать»: баннер в шапке гардероба */
.start{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;width:100%;text-align:left;background:var(--lab);border:2px solid var(--ink);border-left:10px solid #ffd400;padding:10px 12px;margin:-4px 0 14px;box-shadow:0 8px 18px -10px rgba(0,0,0,.4)}
.start b{display:block;font:900 15px var(--disp);text-transform:uppercase}
.start span{display:block;font:500 11px var(--mono);color:var(--ink2);margin-top:2px}
.start .bar{display:flex;gap:3px;margin-top:7px}
.start .bar i{flex:1;height:4px;background:#d7d8db}
.start .bar i.on{background:var(--ink)}
.start em{font:900 22px var(--disp);font-style:normal}
.auth{max-width:480px;margin:0 auto;min-height:100vh}
.toast{position:fixed;left:50%;bottom:calc(76px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;font:600 12px var(--mono);padding:10px 14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.center{padding:40px 20px;font:500 13px/1.6 var(--mono)}
@media (prefers-reduced-motion:reduce){.sheet,.dim,.toast{transition:none}.pending{animation:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <section class="view" id="v-wardrobe"><div class="top"><div class="lt"><h1>Гардероб</h1></div><div class="label" style="height:300px"></div></div></section>
  <section class="view" id="v-wishlist" hidden></section>
  <section class="view" id="v-friends" hidden></section>
  <section class="view" id="v-profile" hidden></section>
</div>
<nav class="tb" aria-label="Разделы">
  <button data-v="wardrobe" aria-current="page">Гардероб</button>
  <button data-v="wishlist">Вишлист</button>
  <button data-v="friends">Друзья</button>
  <button data-v="profile">Профиль</button>
</nav>
<div class="dim" id="dim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <div class="sh-head" id="shHead"><i class="grab"></i><h3 id="shTitle"></h3><button class="x" aria-label="Закрыть" onclick="closeSheet()"><svg width="14" height="14" viewBox="0 0 14 14" stroke="currentColor" stroke-width="2.4"><path d="M2 2l10 10M12 2L2 12"/></svg></button></div>
  <div class="in" id="shBody"></div>
</div>
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Фото"><span class="vc">Нажми или смахни вниз, чтобы закрыть</span><button class="vx" aria-label="Закрыть" onclick="closeViewer()"><svg width="14" height="14" viewBox="0 0 14 14" stroke="currentColor" stroke-width="2.4"><path d="M2 2l10 10M12 2L2 12"/></svg></button><div class="vw" id="vw"></div></div>
<div class="tour" id="tour" role="dialog" aria-modal="true" aria-label="Обучение"><div class="spot" id="tSpot"></div>
  <div class="tcard" id="tCard"><div class="th1"><span id="tStep"></span><button type="button" id="tSkip">Пропустить</button></div><div class="bar" id="tBar"></div>
    <div class="tb2"><h4 id="tTitle"></h4><p id="tText"></p></div>
    <div class="tf"><button type="button" class="btn ghost" id="tBack">Назад</button><button type="button" class="btn" id="tNext">Дальше</button></div></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
const API = location.origin;
const LS = { get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} }, del(k) { try { localStorage.removeItem(k); } catch (_) {} } };
const token = LS.get('sb_token');
const user = (() => { try { return JSON.parse(LS.get('sb_user') || 'null'); } catch (_) { return null; } })();
const H = () => ({ 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
async function api(path, opt = {}) {
  const r = await fetch(API + path, { ...opt, headers: H(), body: opt.body ? JSON.stringify(opt.body) : undefined });
  if (r.status === 401 || r.status === 403) { showLogin('Сессия истекла. Войди заново.'); throw new Error('auth'); }
  if (!r.ok) throw new Error('http ' + r.status);
  return r.status === 204 ? null : r.json();
}

// ── Данные ──
const CATS = [
  { id: 'tops',    title: 'Верх',    full: 'Футболки и рубашки', keys: ['daily_top'],                 zones: ['tops', 'formal_shirt'], kind: 'letter' },

const SHOE_M = [[38.5,6,5.5,24],[39,6.5,6,24.5],[40,7,6,25],[40.5,7.5,6.5,25.5],[41,8,7,26],[42,8.5,7.5,26.5],[42.5,9,8,27],[43,9.5,8.5,27.5],[44,10,9,28],[44.5,10.5,9.5,28.5],[45,11,10,29],[45.5,11.5,10.5,29.5],[46,12,11,30],[47,12.5,11.5,30.5],[47.5,13,12,31]];
const SHOE_F = [[35.5,5,2.5,22],[36,5.5,3,22.5],[36.5,6,3.5,23],[37.5,6.5,4,23.5],[38,7,4.5,24],[38.5,7.5,5,24.5],[39,8,5.5,25],[40,8.5,6,25.5],[40.5,9,6.5,26],[41,9.5,7,26.5],[42,10,7.5,27]];
const LET_M = { XS: 44, S: 46, M: 48, L: 50, XL: 52, XXL: 54, '3XL': 56 };
const LET_F = { XS: 42, S: 44, M: 46, L: 48, XL: 50, XXL: 52, '3XL': 54 };
const fmt = n => String(n).replace('.', ',');
function convert(c, v) {
  if (!v) return [];
  const n = parseFloat(v.replace(',', '.'));
  if (c.kind === 'shoe' && !isNaN(n)) {
    const t = female() ? SHOE_F : SHOE_M;
    const row = t.reduce((a, r) => Math.abs(r[0] - n) < Math.abs(a[0] - n) ? r : a, t[0]);
    return Math.abs(row[0] - n) > 1 ? [] : [['EU', fmt(v)], ['US', fmt(row[1])], ['UK', fmt(row[2])], ['СМ', fmt(row[3])]];
  }
  if (c.kind === 'letter') {
    const L = female() ? LET_F : LET_M, up = v.toUpperCase().replace(/\s/g, '');
    if (L[up]) return [['INT', up], ['RU', String(L[up])]];
    const hit = Object.entries(L).find(([, r]) => r === n);
    return hit ? [['RU', String(n)], ['INT', hit[0]]] : [];
  }
  if (c.kind === 'ring' && !isNaN(n) && n > 13 && n < 25) return [['ММ', fmt(n)], ['RU', fmt(n)], ['US', fmt(Math.round((n - 11.63) / 0.8128 * 4) / 4)]];
  if (c.kind === 'hat' && !isNaN(n) && n > 50 && n < 66) { const L = [[55, 'S'], [57, 'M'], [59, 'L'], [61, 'XL'], [63, 'XXL']]; return [['СМ', fmt(n)], ['INT', (L.find(x => n <= x[0]) || L[4])[1]]]; }
  return [];
}

const external = u => /^https?:\/\//i.test(u || '') && !String(u).startsWith(API);
function img(src, alt, big) {
  if (!src) return `<span class="ini">${esc((alt || '?')[0])}</span>`;
  const first = external(src) ? `${API}/img?w=${big ? 1200 : 400}&u=${encodeURIComponent(src)}` : src;
  return `<img referrerpolicy="no-referrer" ${big ? '' : 'loading="lazy"'} decoding="async" alt="" src="${esc(first)}" data-orig="${esc(src)}" data-alt="${esc((alt || '?')[0])}" onerror="imgFail(this)">`;
}
function imgFail(el) {
  const orig = el.dataset.orig;
  if (!el.dataset.d && orig && el.getAttribute('src') !== orig) { el.dataset.d = 1; el.src = orig; return; }
  const s = document.createElement('span'); s.className = 'ini'; s.textContent = el.dataset.alt || '?'; el.replaceWith(s);
}

function openViewer(src) {

(function () {
  const v = $('viewer'); let y0 = null, x0 = 0, moved = false, multi = false;
  v.addEventListener('touchstart', e => { multi = e.touches.length > 1; y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; moved = false; }, { passive: true });
  v.addEventListener('touchmove', e => { if (multi || e.touches.length > 1) { multi = true; return; } const dy = e.touches[0].clientY - y0; if (Math.abs(dy) > 8) moved = true; if (dy > 0 && window.visualViewport && visualViewport.scale <= 1.01) { $('vw').style.transform = `translateY(${dy}px)`; v.style.background = `rgba(10,10,10,${Math.max(.3, .96 - dy / 500)})`; } }, { passive: true });
  v.addEventListener('touchend', e => { const dy = (e.changedTouches[0].clientY - y0); $('vw').style.transform = ''; v.style.background = ''; if (multi) return; if (dy > 100 || (!moved && !e.target.closest('.vx'))) closeViewer(); });

function qrSvg(text) { if (!window.qrcode || !text) return ''; const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); }

// Выбор фото: камера или галерея, сжатие до 1600 px, загрузка на сервер
function pickFile() { return new Promise(res => { const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.onchange = () => res(i.files && i.files[0] || null); i.click(); }); }
async function shrink(file) {
  const src = URL.createObjectURL(file);
  try {
    const im = await new Promise((ok, no) => { const x = new Image(); x.onload = () => ok(x); x.onerror = no; x.src = src; });
    const k = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight));
    const cv = document.createElement('canvas'); cv.width = Math.round(im.naturalWidth * k); cv.height = Math.round(im.naturalHeight * k);
    cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
    return await new Promise(ok => cv.toBlob(ok, 'image/jpeg', .85));
  } finally { URL.revokeObjectURL(src); }
}
async function choosePhoto(box) {
  const f = await pickFile(); if (!f) return null;
  if (box) box.classList.add('busy');
  try {
    const blob = await shrink(f);
    const r = await fetch(API + '/photos', { method: 'POST', headers: { 'Content-Type': 'image/jpeg', 'Authorization': 'Bearer ' + token }, body: blob });
    if (!r.ok) throw new Error();
    return (await r.json()).url;
  } catch (_) { toast('Фото не загрузилось. Попробуй другое'); return null; }
  finally { if (box) box.classList.remove('busy'); }
}

async function parseItem() {

  $('fParse').textContent = 'Ищу вещь…'; $('fParse').className = 'msg pending';

const SW_W = 168;
function closeSwipes(except) { document.querySelectorAll('.sw.open').forEach(w => { if (w !== except) { w.classList.remove('open'); w.querySelector('.row').style.transform = ''; } }); }
function swiped(row) { const w = row.closest('.sw'); if (w.classList.contains('open')) { closeSwipes(); return true; } return Date.now() - (w._t || 0) < 350; }
document.addEventListener('touchstart', e => {
  const row = e.target.closest('.sw .row'); if (!row) { if (!e.target.closest('.acts2')) closeSwipes(); return; }
  const w = row.parentElement; const x0 = e.touches[0].clientX, y0 = e.touches[0].clientY; let dir = null, dx = 0;
  const base = w.classList.contains('open') ? -SW_W : 0;
  const mv = ev => {
    const x = ev.touches[0].clientX - x0, y = ev.touches[0].clientY - y0;
    if (!dir) { if (Math.abs(x) < 8 && Math.abs(y) < 8) return; dir = Math.abs(x) > Math.abs(y) ? 'h' : 'v'; if (dir === 'h') { closeSwipes(w); w.classList.add('drag'); } }
    if (dir !== 'h') return;
    ev.preventDefault(); dx = x;
    row.style.transform = `translateX(${Math.max(-SW_W - 30, Math.min(0, base + x))}px)`;
  };
  const up = () => {
    row.removeEventListener('touchmove', mv); row.removeEventListener('touchend', up); row.removeEventListener('touchcancel', up);
    if (dir !== 'h') return;
    w.classList.remove('drag'); const open = base + dx < -SW_W / 2;
    w.classList.toggle('open', open); row.style.transform = open ? `translateX(-${SW_W}px)` : ''; w._t = Date.now();
  };
  row.addEventListener('touchmove', mv, { passive: false }); row.addEventListener('touchend', up); row.addEventListener('touchcancel', up);
}, { passive: true });

    </div>
    <div class="acts">${TG && TG.enabled ? (TG.linked ? `<a class="btn ghost" href="https://t.me/${esc(TG.bot)}" target="_blank" rel="noopener">Открыть бота</a><button class="btn ghost" onclick="confirmDel(this,unlinkTg)">Отвязать</button>` : `<a class="btn" href="${esc(TG.link)}" target="_blank" rel="noopener">Подключить бота</a>`) : ''}</div>

    <div class="sec"><h2>Ещё</h2></div>
    <div class="acts"><button class="btn ghost" onclick="startTour()">Пройти обучение ещё раз</button></div>
    <div class="acts"><button class="btn ghost" onclick="setFlag('ui_checklist_hidden','');renderAll();go('wardrobe');runTasks()">С чего начать</button></div>
    <div class="acts"><a class="btn ghost" href="/" onclick="LS.set('sb_page','daily')">Старая версия приложения</a></div>
    <div class="acts"><button class="btn ghost" onclick="confirmDel(this,logout)">Выйти из аккаунта</button></div>
  </div>`;
}
async function saveProfile() {
  const body = {}; ['profile_name', 'profile_lastname', 'profile_height', 'profile_weight', 'profile_age'].forEach(k => body[k] = $('p_' + k).value.trim());
  if (GEN) body.profile_gender = GEN;
  try { await api('/sizes', { method: 'POST', body }); Object.assign(SIZES, body); renderAll(); toast('Профиль сохранён'); }
  catch (e) { if (e.message !== 'auth') { $('pMsg').textContent = 'Не сохранилось. Попробуй ещё раз'; $('pMsg').className = 'msg err'; } }
}
async function unlinkTg() { try { await api('/me/telegram/unlink', { method: 'POST' }); TG = await api('/me/telegram'); renderAll(); toast('Бот отвязан'); } catch (_) {} }
function logout() { LS.del('sb_token'); LS.del('sb_user'); location.href = '/'; }

// ══════════ Подсказки: общий движок для обучения и «С чего начать» ══════════
function setFlag(k, v) { SIZES[k] = v; api('/sizes', { method: 'POST', body: { [k]: v } }).catch(() => {}); }
const G = { steps: [], i: 0, mode: 'tour', timers: [] };
function guideOn() { return $('tour').classList.contains('on'); }
function runGuide(steps, mode, at = 0) {
  if (!steps.length) return;
  G.steps = steps; G.i = at; G.mode = mode;
  closeSheet(true);
  $('tour').classList.add('on'); $('tour').classList.toggle('hint', mode === 'hint');
  if (mode !== 'hint') document.body.classList.add('lock');
  showGuide();
}
function stopGuide() {
  G.timers.forEach(clearTimeout); G.timers = [];
  $('tour').classList.remove('on', 'hint'); document.body.classList.remove('lock');
  if (G.mode === 'tour' && SIZES.ui_tour_done !== '1') setFlag('ui_tour_done', '1');
  if (G.mode !== 'hint') renderWardrobe();
}
function showGuide() {
  const st = G.steps[G.i], n = G.steps.length;
  if (st.v && CUR !== st.v) go(st.v);
  if (st.before) st.before();
  const tour = G.mode === 'tour', tasks = G.mode === 'tasks';
  $('tStep').textContent = tour ? `Обучение · шаг ${G.i + 1} из ${n}` : tasks ? `С чего начать · ${doneCount()} из ${checklist().length} готово` : 'Подсказка';
  $('tSkip').textContent = tour ? 'Пропустить' : 'Закрыть';
  $('tBar').innerHTML = tour || tasks ? G.steps.map((_, i) => `<i class="${i <= G.i ? 'on' : ''}"></i>`).join('') : '';
  $('tTitle').textContent = st.t; $('tText').innerHTML = st.p;
  const back = $('tBack'), next = $('tNext');
  if (tour) { back.hidden = G.i === 0; back.textContent = 'Назад'; next.textContent = G.i === n - 1 ? 'Начать' : 'Дальше'; }
  else if (tasks) { back.hidden = G.i === n - 1; back.textContent = 'Следующий шаг'; next.textContent = st.cta || 'Сделать'; }
  else { back.hidden = true; next.textContent = st.cta || 'Понятно'; }
  // рамка: ставим несколько раз, пока экран не успокоится после смены вкладки и прокрутки
  G.timers.forEach(clearTimeout); G.timers = [];
  const el = findTarget(st);
  if (el) el.scrollIntoView({ block: 'center' });
  [0, 120, 320, 650].forEach(ms => G.timers.push(setTimeout(placeGuide, ms)));
}
function findTarget(st) { return st.sel ? st.sel.split(',').map(x => document.querySelector(x.trim())).find(e => e && e.offsetParent !== null) : null; }
function placeGuide() {
  if (!guideOn()) return;
  const st = G.steps[G.i], card = $('tCard'), spot = $('tSpot'), el = findTarget(st);
  const vh = window.innerHeight, ch = card.offsetHeight + 24;
  if (!el) {
    Object.assign(spot.style, { left: '50%', top: '50%', width: '0px', height: '0px', borderWidth: '0px' });
    card.style.top = Math.max(12, (vh - card.offsetHeight) / 2) + 'px'; card.style.bottom = 'auto'; return;
  }
  const r = el.getBoundingClientRect(), pad = 6;
  Object.assign(spot.style, { left: (r.left - pad) + 'px', top: (r.top - pad) + 'px', width: (r.width + pad * 2) + 'px', height: (r.height + pad * 2) + 'px', borderWidth: '' });
  const below = vh - r.bottom, above = r.top;
  if (below >= ch) { card.style.top = (r.bottom + 14) + 'px'; card.style.bottom = 'auto'; }
  else if (above >= ch) { card.style.top = Math.max(12, r.top - 14 - card.offsetHeight) + 'px'; card.style.bottom = 'auto'; }
  else { card.style.top = Math.max(12, vh - card.offsetHeight - 12) + 'px'; card.style.bottom = 'auto'; }
}
function guideNext() {
  const st = G.steps[G.i];
  if (G.mode === 'tour') { if (G.i >= G.steps.length - 1) return stopGuide(); G.i++; return showGuide(); }
  stopGuide(); if (st.act) setTimeout(st.act, 60);
}
function guideBack() {
  if (G.mode === 'tour') { if (G.i > 0) { G.i--; showGuide(); } return; }
  if (G.mode === 'tasks' && G.i < G.steps.length - 1) { G.i++; showGuide(); }
}
// кнопки карточки создаются один раз — нажатие не теряется при перерисовке
$('tNext').addEventListener('click', e => { e.preventDefault(); guideNext(); });
$('tBack').addEventListener('click', e => { e.preventDefault(); guideBack(); });
$('tSkip').addEventListener('click', e => { e.preventDefault(); stopGuide(); });
let _rz; addEventListener('resize', () => { clearTimeout(_rz); _rz = setTimeout(placeGuide, 150); });
// в режиме подсказки можно нажать прямо на подсвеченное: подсказка закрывается и действие выполняется
document.addEventListener('click', e => { if (G.mode === 'hint' && guideOn() && !e.target.closest('#tCard')) stopGuide(); }, true);

// ══════════ Обучение ══════════
const TOUR = [
  { v: 'wardrobe', t: 'Привет! Это SizeBook', p: 'Здесь хранятся <b>твои размеры и вещи</b>, а близкие по одной ссылке видят, что тебе подарить и какого размера. Покажу всё за минуту.' },
  { v: 'wardrobe', sel: '#v-wardrobe .label', t: 'Паспорт размеров', p: 'Главное в приложении. <b>Нажми на любую ячейку</b>, например «Обувь», и впиши свой размер. Если какой-то не знаешь, оставь пустым.' },
  { v: 'wardrobe', sel: '#v-wardrobe .route', t: 'Перевод размеров', p: 'В карточке размера виден его <b>перевод в другие системы</b>: для обуви US, UK и сантиметры, для одежды INT и RU. Перевод примерный, у брендов бывают отличия.' },
  { v: 'wardrobe', sel: '#v-wardrobe .body .sec', t: 'Мои вещи', p: 'Добавляй вещи, которые <b>хорошо сидят</b>. Вставь ссылку из магазина, и фото, название и бренд подтянутся сами. Отметь размер и посадку: маломерит, в размер или большемерит. Так друзья поймут твой размер в конкретном бренде.' },
  { v: 'wishlist', sel: '#v-wishlist .lt .tbtn', t: 'Вишлист', p: 'Сюда добавляй то, что хочешь получить. Нажми <b>«+ По ссылке»</b> и вставь ссылку на товар из любого магазина. Цена показывается в валюте магазина и в рублях. <b>Смахни строку влево</b>, чтобы отметить «Получил» или удалить. Полученная вещь переедет в гардероб.' },
  { v: 'profile', sel: '#tgBox', t: 'Telegram-бот', p: 'В Профиле нажми <b>«Подключить бота»</b>: откроется Telegram, там нажми <b>«Старт»</b>. Дальше просто пересылай боту ссылки на товары и посты из каналов, и всё попадёт в твой вишлист.' },
  { v: 'friends', sel: '#v-friends .label', t: 'Ссылка для друзей', p: 'Здесь создаётся <b>ссылка и QR-код</b> для близких. Ссылку можно отправить в любой мессенджер и отключить в любой момент.' },
  { v: 'friends', sel: '#fSec', t: 'Что увидят друзья', p: '<b>Отметь галочками</b>, что показывать: размеры, размеры по брендам из твоих вещей и вишлист. Потом нажми «Создать ссылку» или «Применить настройки».' },
  { v: 'profile', sel: '#pAbout', t: 'Профиль', p: 'Укажи <b>пол и рост</b>: от них зависит перевод размеров. Пройти обучение ещё раз можно кнопкой внизу Профиля.' },
  { v: 'wardrobe', sel: '#v-wardrobe .start', t: 'С чего начать', p: 'Наверху гардероба есть <b>жёлтая плашка «С чего начать»</b>. Нажми на неё, и я по шагам покажу, что сделать первым: размеры, первая вещь, вишлист, бот и ссылка.' },
];
function startTour() { runGuide(TOUR, 'tour'); }

// ══════════ С чего начать ══════════
function checklist() {
  const filled = CATS.filter(c => val(c)).length, empty = CATS.find(c => !val(c)) || CATS[0];
  return [
    { k: 'profile', ok: !!(SIZES.profile_gender && SIZES.profile_height), v: 'profile', sel: '#pAbout', t: 'Пол и рост', p: 'Впиши <b>рост</b> и выбери <b>пол</b>, потом нажми «Сохранить». От этого зависит перевод размеров.', cta: 'Понятно', act: () => $('p_profile_height') && $('p_profile_height').focus() },
    { k: 'sizes', ok: filled >= 3, v: 'wardrobe', sel: '#v-wardrobe .label', t: 'Три размера', p: `Нажми на ячейку и впиши размер. Заполнено <b>${filled} из 6</b>. Начни с обуви и верха.`, cta: 'Вписать размер', act: () => openCat(empty.id) },
    { k: 'item', ok: ITEMS.length > 0, v: 'wardrobe', sel: '#v-wardrobe .body .sec', t: 'Первая вещь', p: 'Добавь вещь, которая <b>хорошо сидит</b>. Вставь ссылку из магазина или заполни вручную, укажи размер и посадку.', cta: 'Добавить вещь', act: () => openItemForm() },
    { k: 'wish', ok: WISH.length > 0, v: 'wishlist', sel: '#v-wishlist .lt .tbtn', t: 'Первое желание', p: 'Нажми <b>«+ По ссылке»</b> и вставь ссылку на вещь, которую хочешь получить.', cta: 'Добавить в вишлист', act: () => openWishForm() },
    { k: 'bot', ok: !!(TG && TG.linked), v: 'profile', sel: '#tgBox', t: 'Telegram-бот', p: 'Нажми <b>«Подключить бота»</b>, в Telegram нажми <b>«Старт»</b>. Потом пересылай боту ссылки и посты, и они попадут в вишлист.', cta: 'Подключить', act: () => { if (TG && TG.link) location.href = TG.link; } },
    { k: 'link', ok: !!SHARE, v: 'friends', sel: '#fSend', t: 'Ссылка близким', p: 'Отметь, что показывать, и нажми <b>«Создать ссылку»</b>. Отправь её тем, кто будет дарить подарки.', cta: 'Создать ссылку', act: () => makeLink() },
  ];
}
const doneCount = () => checklist().filter(x => x.ok).length;
function startBanner() {
  if (SIZES.ui_checklist_hidden) return '';
  const L = checklist(), d = L.filter(x => x.ok).length;
  if (d === L.length) return '';
  const nxt = L.find(x => !x.ok);
  return `<button class="start" onclick="runTasks()"><div><b>С чего начать · ${d} из ${L.length}</b><span>Дальше: ${nxt.t.toLowerCase()}</span><div class="bar">${L.map(x => `<i class="${x.ok ? 'on' : ''}"></i>`).join('')}</div></div><em>→</em></button>`;
}
function runTasks() { const todo = checklist().filter(x => !x.ok); if (todo.length) runGuide(todo, 'tasks'); else toast('Все шаги уже сделаны'); }

// ══════════ Навигация ══════════
const VIEWS = ['wardrobe', 'wishlist', 'friends', 'profile'];
let CUR = 'wardrobe';
function go(v, push = true) {
  if (!VIEWS.includes(v)) v = 'wardrobe';
  CUR = v; closeSheet(true);
  VIEWS.forEach(x => { $('v-' + x).hidden = x !== v; });
  document.querySelectorAll('.tb button').forEach(b => b.dataset.v === v ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  document.title = 'SizeBook · ' + { wardrobe: 'Гардероб', wishlist: 'Вишлист', friends: 'Друзья', profile: 'Профиль' }[v];
  if (push) history.replaceState(null, '', v === 'wardrobe' ? '/passport' : '/passport#' + v);
  window.scrollTo(0, 0);
}
document.querySelectorAll('.tb button').forEach(b => b.addEventListener('click', () => go(b.dataset.v)));
function renderAll() { renderWardrobe(); renderWishlist(); renderFriends(); renderProfile(); }

// ══════════ Шторка: открытие, закрытие, свайп вниз ══════════
const sheet = $('sheet'), dim = $('dim');
function openSheet(title, html) {
  $('shTitle').textContent = title; $('shBody').innerHTML = html; $('shBody').scrollTop = 0;
  sheet.style.transform = ''; sheet.classList.add('on'); dim.classList.add('on'); document.body.classList.add('lock');
}
function closeSheet(instant) {
  if (!sheet.classList.contains('on')) return;
  sheet.classList.remove('on'); dim.classList.remove('on'); document.body.classList.remove('lock'); sheet.style.transform = ''; dim.style.opacity = '';
  if (instant) { sheet.classList.add('drag'); requestAnimationFrame(() => sheet.classList.remove('drag')); }
}
dim.addEventListener('click', () => closeSheet());
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
(function swipe() {
  let y0 = null, dy = 0, t0 = 0, fromBody = false;
  const body = $('shBody');
  const start = (y, isBody) => { y0 = y; dy = 0; t0 = Date.now(); fromBody = isBody; };
  const move = (y, e) => {
    if (y0 === null) return;
    dy = Math.max(0, y - y0);
    if (fromBody && (body.scrollTop > 0 || dy === 0)) { if (body.scrollTop > 0) y0 = null; return; }
    if (e.cancelable) e.preventDefault();
    sheet.classList.add('drag');
    sheet.style.transform = `translate(-50%, ${dy}px)`;
    dim.style.opacity = String(Math.max(0, 1 - dy / 400));
  };
  const end = () => {
    if (y0 === null) return;
    const v = dy / Math.max(1, Date.now() - t0);
    sheet.classList.remove('drag');
    if (dy > 110 || (dy > 30 && v > .5)) closeSheet(); else { sheet.style.transform = ''; dim.style.opacity = ''; }
    y0 = null; dy = 0;
  };
  $('shHead').addEventListener('touchstart', e => start(e.touches[0].clientY, false), { passive: true });
  body.addEventListener('touchstart', e => { if (body.scrollTop <= 0) start(e.touches[0].clientY, true); }, { passive: true });
  sheet.addEventListener('touchmove', e => move(e.touches[0].clientY, e), { passive: false });
  sheet.addEventListener('touchend', end); sheet.addEventListener('touchcancel', end);
  // мышью — за шапку
  $('shHead').addEventListener('mousedown', e => { if (e.target.closest('.x')) return; start(e.clientY, false); const mm = ev => move(ev.clientY, ev), mu = () => { end(); removeEventListener('mousemove', mm); removeEventListener('mouseup', mu); }; addEventListener('mousemove', mm); addEventListener('mouseup', mu); });
})();

let toastT; function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2200); }
let AUTH_MODE = 'login';
function showLogin(msg) {
  if (msg && /сессия/i.test(msg)) { LS.del('sb_token'); LS.del('sb_user'); }
  document.querySelector('.tb').hidden = true;
  const reg = AUTH_MODE === 'register';
  $('app').innerHTML = `<div class="auth">
    <div class="top"><div class="lt"><h1>SizeBook</h1></div>
      <div class="label">
        <div class="z1 span3">ПАСПОРТ РАЗМЕРОВ:<b>${reg ? 'Новый аккаунт' : 'Вход'}</b>Твои размеры и вещи в одном месте. Друзья смотрят их по ссылке и дарят точно в размер.</div>
      </div></div>
    <div class="body">
      <form class="form" style="grid-template-columns:1fr" onsubmit="doAuth(event)">
        ${reg ? '<label class="fld"><span class="cap">Имя пользователя</span><input id="aUser" autocomplete="username" autocapitalize="none" required placeholder="ivan"></label><label class="fld"><span class="cap">Email</span><input id="aEmail" type="email" autocomplete="email" required placeholder="ivan@mail.ru"></label>'
              : '<label class="fld"><span class="cap">Логин или email</span><input id="aLogin" autocomplete="username" autocapitalize="none" required placeholder="julia"></label>'}
        <label class="fld"><span class="cap">Пароль</span><input id="aPass" type="password" autocomplete="${reg ? 'new-password' : 'current-password'}" required></label>
        <button class="btn wide" type="submit">${reg ? 'Создать аккаунт' : 'Войти'}</button>
      </form>
      <div class="msg ${msg ? 'err' : ''}" id="aMsg">${esc(msg || '')}</div>
      <div class="acts"><button class="btn ghost" onclick="AUTH_MODE='${reg ? 'login' : 'register'}';showLogin('')">${reg ? 'У меня уже есть аккаунт' : 'Создать аккаунт'}</button></div>
    </div></div>`;
}
async function doAuth(e) {
  e.preventDefault();
  const reg = AUTH_MODE === 'register';
  const body = reg ? { username: $('aUser').value.trim(), email: $('aEmail').value.trim(), password: $('aPass').value } : { email: $('aLogin').value.trim(), password: $('aPass').value };
  $('aMsg').className = 'msg'; $('aMsg').textContent = reg ? 'Создаю аккаунт…' : 'Вхожу…';
  try {
    const r = await fetch(API + (reg ? '/auth/register' : '/auth/login'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.token) throw new Error(j.error || 'Не получилось войти');
    LS.set('sb_token', j.token); LS.set('sb_user', JSON.stringify(j.user || {}));
    location.href = '/passport';
  } catch (er) { $('aMsg').className = 'msg err'; $('aMsg').textContent = er.message === 'Failed to fetch' ? 'Нет связи с сервером. Проверь интернет' : er.message; }
}

async function load() {
  if (!token) return showLogin('');
  go((location.hash || '').slice(1) || 'wardrobe', false);
  try {
    const [s, i, w, sh] = await Promise.all([api('/sizes'), api('/items').catch(() => []), api('/wishlist').catch(() => []), api('/share').catch(() => null)]);
    SIZES = s || {}; ITEMS = i || []; WISH = w || []; SHARE = sh;
    renderAll(); pollWish();
    if (SIZES.ui_tour_done !== '1' && !ITEMS.length && !WISH.length) setTimeout(startTour, 500);
    fetch(API + '/rates').then(r => r.ok ? r.json() : null).then(r => { if (r) { RATES = r; renderWishlist(); } }).catch(() => {});
    api('/me/telegram').then(t => { TG = t; renderProfile(); renderWardrobe(); }).catch(() => { TG = { enabled: false }; renderProfile(); });
  } catch (e) { if (e.message !== 'auth') showLogin('Не удалось загрузить данные. Проверь интернет и обнови страницу.'); }
}
load();
